<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - HDO Pro</title>
    <meta property="og:url" content="/404" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <meta property="og:title" content="404 | Page Not Found">
    <meta property="og:description" content="The page you're looking for doesn't exist.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 10px;
        }

        .mist {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/Images/mist.png') repeat;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            animation: moveMist 60s linear infinite;
        }

        @keyframes moveMist {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 90%;
            width: 400px;
            background-color: rgba(51, 51, 51, 0.8);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 18px;
            color: #ffc0cb;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #ddd;
            margin: 5px 0;
        }

        .logo {
            width: 60px;
            opacity: 0.6;
            margin-bottom: 10px;
        }

        .gif {
            width: 120px;
            margin: 10px 0;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .loading-dots div {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            margin: 0 3px;
            animation: dot-blink 1.5s infinite ease-in-out;
        }

        .loading-dots div:nth-child(2) {
            animation-delay: 0.3s;
        }

        .loading-dots div:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes dot-blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>
    <div class="mist"></div>
    <div class="container">
        <img src="/images/logo.png" alt="Logo" class="logo">
        <h1>Oops! Page Not Found</h1>
        <p>Sorry, the page you are looking for could not be found.</p>
        <p>Don't worry, be happy! This page is not lost, it's just exploring new territories.</p>
        <p class="redirect-info">In the meantime, you will be redirected to the home page shortly.</p>
        <img src="/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif" alt="Dancing Cat GIF" class="gif">
        <div class="loading-dots">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
    <script>
        // Redirect to the specified URL after 5 seconds
        setTimeout(function() {
            window.location.href = 'https://hdopro.netlify.app/';
        }, 5000);
    </script>
</body>
</html>
