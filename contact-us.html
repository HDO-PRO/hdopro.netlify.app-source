<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - HDO Pro</title>
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
    background-image: url('Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: rgba(49, 21, 75, 0.8); /* Purple with transparency */
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    position: relative;
    text-align: center;
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  .notification {
    background-color: rgba(49, 21, 75, 0.8); /* Purple with transparency */
    color: #ffc0cb;
    padding: 10px;
    text-align: center;
    margin-bottom: 20px;
  }

  .email-button {
    background-color: #7289da;
    color: #ffffff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    text-decoration: none;
    display: inline-block;
  }

  .email-button:hover {
    background-color: #677bc4;
  }

  p {
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Contact Us</h1>
  <div class="notification">
    <p>This is meant to be opened on mobile.</p>
  </div>
  <a href="mailto:hdopro@protonmail.com" class="email-button">Email Us</a>
</div>
</body>
</html>
