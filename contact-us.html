<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - HDO Pro</title>
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
    background-image: url('your-wallpaper-image.jpg');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: rgba(49, 21, 75, 0.8); /* Purple with transparency */
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    position: relative;
    text-align: center;
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  p {
    margin-bottom: 10px;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
    border-radius: 5px;
    border: 1px solid #ccc;
    background-color: rgba(255, 255, 255, 0.2); /* Transparent white */
    color: #ffc0cb;
  }

  input[type="submit"] {
    background-color: #7289da;
    color: #ffffff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  input[type="submit"]:hover {
    background-color: #677bc4;
  }

  /* Modal Styling */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black overlay */
  }

  .modal-content {
    background-color: rgba(49, 21, 75, 0.9); /* Purple with transparency */
    color: #ffc0cb;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    width: 300px;
    padding: 20px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .modal-content button {
    background-color: #7289da;
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .modal-content button:hover {
    background-color: #677bc4;
  }

  /* Spoiler effect for email */
  .spoiler {
    color: transparent;
    text-shadow: 0 0 5px rgba(255,255,255,0.5);
    cursor: pointer;
    transition: color 0.3s ease;
    display: inline-block;
  }

  .spoiler:hover {
    color: initial;
    text-shadow: none;
  }
</style>
<script>
  // Function to close the modal
  function closeModal() {
    document.getElementById('humanCheckModal').style.display = 'none';
  }

  // Function to handle form submission (replace with actual logic)
  document.addEventListener("DOMContentLoaded", function() {
    var form = document.querySelector("form");
    form.addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent default form submission

      // Display human check modal
      document.getElementById('humanCheckModal').style.display = 'block';
    });
  });

  window.onload = function() {
    document.getElementById('humanCheckModal').style.display = 'block';
  }
</script>
</head>
<body>
<!-- Modal -->
<div id="humanCheckModal" class="modal">
  <div class="modal-content">
    <h2>Are you human?</h2>
    <button onclick="closeModal()">Yes, I am human</button>
  </div>
</div>

<div class="container">
  <h1>Contact Us</h1>
  <p>We are not accepting messages here at this time. However, you can still reach us via email at <span class="spoiler" onclick="this.classList.remove('spoiler');">hdopro@protonmail.com</span>.</p>
  <p>Have questions or suggestions? Fill out the form below.</p>
  <form action="send_email.php" method="post">
    <input type="text" name="name" placeholder="Your Name" required><br>
    <input type="email" name="email" placeholder="Your Email" required><br>
    <textarea name="message" rows="4" placeholder="Your Message" required></textarea><br>
    <input type="submit" value="Submit">
  </form>
</div>

<script>
  function closeModal() {
    document.getElementById('humanCheckModal').style.display = 'none';
  }
</script>
</body>
</html>
