<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <!-- Fast meta redirect as fallback -->
  <meta http-equiv="refresh" content="0;url=https://github.com/MarshMeadow">
  <!-- JavaScript redirect — executes immediately -->
  <script>
    // Replace current history entry so back button doesn't return here
    location.replace("https://github.com/MarshMeadow");
  </script>
  <!-- Minimal style to avoid visible flash on very slow clients -->
  <style>html,body{height:100%;margin:0;background:#fff}</style>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <!-- Accessible fallback link for browsers without JS or meta-refresh support -->
  <a href="https://github.com/MarshMeadow">Continue to GitHub</a>
<script src="script.js" defer></script>
</body>
</html>
