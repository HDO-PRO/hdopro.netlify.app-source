<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Discord - HDO Pro</title>
    <meta property="og:url" content="/discord" />
    <meta property="og:title" content="HDO Pro | Discord">
    <meta property="og:description" content="Join the HDO Pro Discord Community.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border-radius: 12px;
            text-align: center;
        }
        .card h1 {
            margin: 0 0 12px;
            font-size: 1.6rem;
        }
        .card p {
            margin: 8px 0;
            color: #ddd;
        }
        .btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 28px;
            border-radius: 8px;
            background: #7289da;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .btn:hover {
            background: #677bc4;
            transform: translateY(-2px);
        }
        @media (max-width: 480px) {
            .card { padding: 22px; }
            .card h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <main class="card hdo-glass">
        <h1>Join Our Discord</h1>
        <p>Connect with the HDO Pro community, get support, and stay updated.</p>
        <a class="btn" href="https://discord.com/invite/7aGtmnmc9T" target="_blank" rel="noopener noreferrer">Join Discord</a>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
