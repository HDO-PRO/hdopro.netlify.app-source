<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:url" content="/discord" />
<title>Join Discord - HDO Pro</title>
<link href="style.css" rel="stylesheet" type="text/css" />
<link rel="icon" href="/images/logo.png" type="image/png">
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
    background-image: url('Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp');
    background-size: cover;
    background-repeat: no-repeat;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: rgba(114, 137, 218, 0.7); /* Discord light theme background color with transparency */
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  p {
    margin-bottom: 10px;
    color: #ffc0cb;
  }

  /* Discord Button */
  .discord-btn {
    display: inline-block;
    background-color: #7289da;
    color: #ffffff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 5px;
    transition: background-color 0.3s ease;
    cursor: pointer;
  }

  .discord-btn:hover {
    background-color: #677bc4;
  }

  /* Social Media Icons */
  .social-icons {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .social-icons img {
    width: 40px;
    height: 40px;
    margin: 0 10px;
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Modal Styling */
  .modal-overlay {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
  }

  .modal-content {
    background-color: #7289da;
    color: #ffffff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    width: 300px;
    padding: 20px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .modal-content h2 {
    margin-top: 0;
  }

  .modal-content p {
    margin-bottom: 10px;
  }

  .modal-content button {
    background-color: #ffffff;
    color: #7289da;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.3s ease;
  }

  .modal-content button:hover {
    background-color: #e0e0e0;
  }
</style>
</head>
<body>
<!-- Modal -->
<div id="humanCheckModal" class="modal-overlay">
  <div class="modal-content">
    <h2>Are you human?</h2>
    <p>Please confirm that you are not a robot.</p>
    <button onclick="closeModal()">Yes, I am human</button>
  </div>
</div>

<div class="container">
  <h1>Join Our Discord Community</h1>
  <p>Click the button below to join our Discord server and connect with us.</p>
  <a href="https://discord.com/invite/7aGtmnmc9T" class="discord-btn">Join Discord</a>
</div>

<div class="social-icons">
  <!-- Placeholder images (replace with actual social icons) -->
  <img src="path/to/facebook-logo.png" alt="Facebook">
  <img src="path/to/twitter-logo.png" alt="Twitter">
  <img src="path/to/instagram-logo.png" alt="Instagram">
  <img src="path/to/linkedin-logo.png" alt="LinkedIn">
</div>

<script>
  function closeModal() {
    document.getElementById('humanCheckModal').style.display = 'none';
  }

  window.onload = function() {
    var visited = localStorage.getItem('visited');
    if (!visited) {
      document.getElementById('humanCheckModal').style.display = 'block';
      localStorage.setItem('visited', true);
    }
  };

  // Disable right-click
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Disable text selection
  document.addEventListener('selectstart', function(e) {
    e.preventDefault();
  });

  // Disable developer tools
  document.onkeydown = function(e) {
    if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 123)) {
      return false;
    }
  };

  // Alert message on inspect element
  window.addEventListener('devtoolschange', function(event) {
    document.body.style.display = 'none';
    alert('Please respect our work! Do not inspect the page.');
  });
</script>
</body>
</html>
