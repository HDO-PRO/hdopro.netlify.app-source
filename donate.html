<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support the Developers</title>
<meta property="og:url" content="/donate" />
<link href="style.css" rel="stylesheet" type="text/css" />
<meta property="og:title" content="HDO Pro | Support the Developers">
<meta property="og:description" content="Support the developers behind HDO Pro.">
<meta property="og:image" content="/images/logo.png">
<meta property="og:image:type" content="image/png">
<meta name="theme-color" content="#8d2249" />
<link rel="icon" href="/images/logo.png" type="image/png">
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-image: url('Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp');
    background-size: cover;
    background-repeat: no-repeat;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: rgba(114, 137, 218, 0.7); /* Discord light theme background color with transparency */
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  .donation-banner {
    margin: 20px 0;
  }

  .donation-banner img {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
  }

  .donation-section {
    margin-top: 20px;
  }

  .donation-section a {
    color: #fff;
    background-color: #ff69b4;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 18px;
    display: inline-block;
    transition: background-color 0.3s ease;
  }

  .donation-section a:hover {
    background-color: #d4448c;
  }

  footer {
    text-align: center;
    margin-top: 20px;
    padding: 10px 0;
    background-color: rgba(58, 22, 83, 0.4); /* Lighter background color for footer */
    font-size: 14px;
    color: #aaa;
  }

  footer a {
    color: #ffc0cb;
    text-decoration: none;
  }

  footer a:hover {
    color: #ff69b4;
  }

  @media screen and (max-width: 600px) {
    h1 {
      font-size: 24px;
    }
    .container {
      padding: 10px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Support the Developers</h1>
  <p style="color: #ff69b4;">Your support helps us continue to improve HDO Pro and keep it free for everyone. Thank you for your generosity!</p>
  
  <div class="donation-banner">
    <img src="Images/donation-banner.jpg" alt="Support Us Banner">
  </div>

  <div class="donation-section">
    <a href="https://ko-fi.com/marshmeadow" target="_blank">Donate Now</a>
  </div>
</div>

<footer>
  <p>We do not host the content or servers provided in this app, nor do we host any streams. For more DMCA information, <a href="/dmca">click here</a>.</p>
</footer>
</body>
</html>
