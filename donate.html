<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate | HDO Pro</title>
    <meta property="og:url" content="/donate" />
    <meta property="og:title" content="Donate to HDO Pro">
    <meta property="og:description" content="Support HDO Pro on Ko-fi or Patreon.">
    <meta property="og:image" content="/Images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .donate-wrap { max-width: 720px; margin: 0 auto; padding: 90px 20px 120px; position: relative; z-index: 1; }
        .donate-header { text-align: center; font-size: 1.5rem; color: #ff66b2; margin-bottom: 32px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }
        .donate-wrap .container { padding: 36px 32px; }
        .donate-wrap h1 { color: #ff66b2; margin: 0 0 12px; }
        .donate-wrap > .container > p { color: #eee; max-width: 520px; margin: 0 auto 32px; line-height: 1.5; }
        .donate-grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 24px; }
        .donate-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 220px; padding: 32px 26px;
            background: linear-gradient(145deg, rgba(255,102,178,0.12) 0%, rgba(20,20,20,0.92) 100%);
            border: 1px solid rgba(255,102,178,0.25);
            border-radius: 20px;
            color: #fff; text-decoration: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .donate-card:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(255,102,178,0.55); box-shadow: 0 16px 40px rgba(255,102,178,0.2), 0 12px 30px rgba(0,0,0,0.5); }
        .donate-card i { font-size: 2.2rem; margin-bottom: 10px; }
        .donate-card strong { font-size: 1.2rem; margin-bottom: 8px; }
        .donate-card span { font-size: 0.9rem; color: #ddd; text-align: center; }
        .donate-card.ko-fi i { color: #ff66b2; }
        .donate-card.patreon i { color: #ff9900; }
        .donate-home { display: inline-block; margin-top: 34px; padding: 10px 18px; color: #ff66b2; text-decoration: none; border: 1px solid rgba(255,102,178,0.4); border-radius: 10px; transition: background 0.2s, color 0.2s; }
        .donate-home:hover { background: rgba(255,102,178,0.12); }
        @media (max-width: 540px) {
            .donate-wrap { padding-top: 70px; }
            .donate-wrap .container { padding: 28px 20px; }
            .donate-header { font-size: 1.25rem; }
            .donate-card { min-height: auto; padding: 26px 20px; }
        }
    </style>
</head>
<body>
    <canvas id="hdo-pixels" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></canvas>
    <script src="pixels.js" defer></script>

    <div class="donate-wrap">
        <header class="donate-header">HDO Pro</header>

        <section class="container">
            <h1>Support HDO Pro</h1>
            <p>Your support helps keep the project alive and the community running. Choose a platform below to contribute.</p>

            <div class="donate-grid">
                <a class="donate-card ko-fi" href="https://ko-fi.com/marshmeadow" target="_blank" rel="noopener noreferrer" aria-label="Support us on Ko-fi (opens in new tab)">
                    <i class="fa-solid fa-mug-hot"></i>
                    <strong>Support us on Ko-fi</strong>
                    <span>Buy us a coffee on Ko-fi.</span>
                </a>

                <a class="donate-card patreon" href="https://www.patreon.com/YOUR_PATREON_URL" target="_blank" rel="noopener noreferrer" aria-label="Join us on Patreon (opens in new tab)">
                    <i class="fa-brands fa-patreon"></i>
                    <strong>Join us on Patreon</strong>
                    <span>Get access to Patreon perks.</span>
                </a>
            </div>

            <a class="donate-home" href="/h0m3"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

        </section>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
