<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate | HDO Pro</title>
    <meta property="og:url" content="/donate" />
    <meta property="og:title" content="Donate to HDO Pro">
    <meta property="og:description" content="Support HDO Pro on Ko-fi or Patreon.">
    <meta property="og:image" content="/Images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .donate-wrap { max-width: 760px; margin: 0 auto; padding: 80px 20px 120px; position: relative; z-index: 1; }
        .donate-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 24px; }
        .donate-card {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; padding: 22px;
            color: #fff; text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .donate-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .donate-card i { font-size: 1.6rem; }
        .donate-card.ko-fi i { color: #ff66b2; }
        .donate-card.patreon i { color: #ff9900; }
        .donate-home { display: inline-block; margin-top: 28px; color: #ff66b2; text-decoration: none; }
        .donate-home:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .donate-wrap { padding-top: 60px; }
            .donate-card { padding: 18px; }
        }
    </style>
</head>
<body>
    <canvas id="hdo-pixels" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></canvas>
    <script src="pixels.js" defer></script>

    <div class="donate-wrap">
        <header class="h0m3-header">HDO Pro</header>

        <section class="container">
            <h1>Support HDO Pro</h1>
            <p>Your support helps keep the project alive and the community running. Choose a platform below to contribute.</p>

            <div class="donate-grid">
                <a class="donate-card ko-fi" href="https://ko-fi.com/marshmeadow" target="_blank" rel="noopener noreferrer" aria-label="Support us on Ko-fi (opens in new tab)">
                    <i class="fa-solid fa-mug-hot"></i>
                    <strong>Support us on Ko-fi</strong>
                    <span>Buy us a coffee on Ko-fi.</span>
                </a>

                <a class="donate-card patreon" href="https://www.patreon.com/YOUR_PATREON_URL" target="_blank" rel="noopener noreferrer" aria-label="Join us on Patreon (opens in new tab)">
                    <i class="fa-brands fa-patreon"></i>
                    <strong>Join us on Patreon</strong>
                    <span>Get access to Patreon perks.</span>
                </a>
            </div>

            <a class="donate-home" href="/h0m3"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </section>
    </div>
</body>
</html>
