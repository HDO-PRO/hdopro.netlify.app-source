    <script>
        const gifs = [
            '/Images/150f78d18fd597611f77b4ae7d2f1f58.gif',
            '/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif'
        ];
        
        const gifElement = document.getElementById('animated-gif');
        let clickCount = 0;

        function getRandomIndex() {
            return Math.floor(Math.random() * gifs.length);
        }

        function switchGif() {
            gifElement.src = gifs[getRandomIndex()];
        }

        function handleGifClick() {
            clickCount++;
            if (clickCount === 1) {
                // Do nothing on the first click
            } else if (clickCount === 2) {
                switchGif(); // Change GIF on second click
            }
        }

        // Set initial GIF randomly on page load
        switchGif();

        // Switch GIF every 5 minutes (300,000 milliseconds)
        setInterval(switchGif, 300000);

        // Disable right-click and context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Disable text selection
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });

        // Disable mouse down events
        document.addEventListener('mousedown', function(e) {
            e.preventDefault();
        });

        // Disable F12 and other developer tools access
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'I' || e.key === 'U' || e.key === 'C'))) {
                e.preventDefault();
            }
        });
    </script>
