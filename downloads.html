<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro | Downloads</title>
    <meta property="og:url" content="/downloads" />
    <meta property="og:title" content="HDO Pro | Downloads">
    <meta property="og:description" content="Download HDO Pro APKs">
    <meta property="og:image" content="/Images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background-color: rgba(51, 51, 51, 0.8);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin-top: 50px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

            .container h1 {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .container p {
                font-size: 14px;
                margin-bottom: 10px;
                color: #ddd;
            }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

            .button-container a {
                display: inline-block;
                margin: 10px;
                text-decoration: none;
                color: #fff;
                background-color: #7289DA;
                border-radius: 5px;
                padding: 10px 20px;
                transition: background-color 0.3s ease;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                width: 200px;
                text-align: center;
            }

                .button-container a:hover {
                    background-color: #677BC4;
                }

        .info-message {
            font-size: 12px;
            color: #ddd;
            margin-top: 10px;
        }

        .notice {
            background-color: rgba(255, 85, 85, 0.5);
            color: #fff;
            border: 2px solid rgba(255, 85, 85, 0.8);
            padding: 10px 20px;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }

        .repo-gate {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,.2);
            font-size: 14px;
        }

        #repo-link {
            color: #ff66b2;
            word-break: break-all;
            transition: filter 0.4s ease;
        }

        #repo-link.locked {
            filter: blur(5px);
            text-decoration: none;
        }

        .repo-btn {
            margin-top: 10px;
            background: #ff66b2;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .repo-btn:hover { background: #e05599; }

        #repo-puzzle {
            display: none;
            margin-top: 12px;
        }

        #repo-puzzle input {
            padding: 8px;
            border: 1px solid #ff66b2;
            border-radius: 6px;
            background: #000;
            color: #fff;
            text-align: center;
            width: 120px;
        }

        #repo-err {
            color: #ff5555;
            font-size: 12px;
            min-height: 1em;
            margin: 6px 0 0;
        }
    </style>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function (event) {
            if (event.ctrlKey && (event.key === 'u' || event.key === 's' || event.key === 'i' || event.key === 'c' || event.key === 'j')) {
                event.preventDefault();
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>HDO Pro Downloads</h1>
        <p>Downloads have moved to the terminal. You can access them there.</p>
        <div class="button-container">
            <a href="/terminal" target="_blank" rel="noopener noreferrer">Terminal</a>
            <a href="/h0m3" target="_blank" rel="noopener noreferrer">Back to Home</a>
        </div>

        <div class="repo-gate">
            <p>Private community repo (solve the puzzle to reveal):</p>
            <a id="repo-link" class="locked" href="#">https://github.com/MarshMeadow/nothing</a>
            <div><button id="repo-unlock" class="repo-btn" type="button">Reveal Link</button></div>
            <div id="repo-puzzle">
                <p id="repo-q"></p>
                <input id="repo-a" type="text" autocomplete="off" placeholder="Answer">
                <button id="repo-submit" class="repo-btn" type="button">Unlock</button>
                <p id="repo-err"></p>
            </div>
        </div>

    </div>
<script>
    (function () {
        var repoUrl = 'https://github.com/MarshMeadow/nothing';
        var link = document.getElementById('repo-link');
        var unlockBtn = document.getElementById('repo-unlock');
        var puzzle = document.getElementById('repo-puzzle');
        var qEl = document.getElementById('repo-q');
        var aEl = document.getElementById('repo-a');
        var errEl = document.getElementById('repo-err');
        var submitBtn = document.getElementById('repo-submit');
        var answer;

        function makePuzzle() {
            var x = Math.floor(Math.random() * 9) + 2;
            var y = Math.floor(Math.random() * 9) + 2;
            qEl.textContent = 'What is ' + x + ' + ' + y + '?';
            answer = x + y;
            aEl.value = '';
            errEl.textContent = '';
        }

        unlockBtn.addEventListener('click', function () {
            puzzle.style.display = 'block';
            unlockBtn.style.display = 'none';
            makePuzzle();
            aEl.focus();
        });

        function check() {
            if (parseInt(aEl.value.trim(), 10) === answer) {
                link.classList.remove('locked');
                link.href = repoUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                puzzle.style.display = 'none';
            } else {
                errEl.textContent = 'Wrong answer. Try again.';
                aEl.select();
            }
        }

        submitBtn.addEventListener('click', check);
        aEl.addEventListener('keypress', function (e) { if (e.key === 'Enter') check(); });
        link.addEventListener('click', function (e) { if (link.classList.contains('locked')) e.preventDefault(); });
    })();
</script>
<script src="script.js" defer></script>
<canvas id="hdo-pixels" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></canvas>
<script src="pixels.js" defer></script>
</body>
</html>
