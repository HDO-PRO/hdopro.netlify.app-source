<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Example with Dimming</title>
    <style>
        /* Overlay style for dimming the entire page */
        .page-dim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Dimmed background */
            z-index: 999; /* Below the popup */
            display: none; /* Hidden initially */
            pointer-events: none; /* Allow clicks only on the popup */
        }

        /* Popup overlay styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent black background */
            display: none; /* Hidden initially */
            z-index: 1000;
        }

        /* Popup styles */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9); /* Dark background for popup */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); /* Glow effect */
            z-index: 1001;
            color: #fff;
            text-align: center;
            width: 90%;
            max-width: 400px;
            display: none; /* Hidden initially */
            animation: fadeIn 0.5s ease-out; /* Fade in effect */
        }

        /* Animation for fade in */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Button styling */
        .close-btn {
            background-color: #ff6666;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }

            .close-btn:hover {
                background-color: #ff4444;
            }
    </style>
</head>
<body>
    <!-- Dimming background -->
    <div id="page-dim" class="page-dim"></div>

    <!-- Popup Overlay -->
    <div id="popup-overlay" class="popup-overlay">
        <!-- Popup Message -->
        <div id="popup-message" class="popup">
            <h2>Welcome to our Site!</h2>
            <p>This is a dimmed page with a popup for important announcements.</p>
            <button class="close-btn" onclick="closePopup()">Got it!</button>
        </div>
    </div>

    <script>
        // Function to close the popup and remove the dimming effect
        function closePopup() {
            // Hide the popup and overlay
            document.getElementById('popup-overlay').style.display = 'none';
            document.getElementById('popup-message').style.display = 'none';
            // Remove the dimming effect on the page
            document.getElementById('page-dim').style.display = 'none';
        }

        // Show the popup and dimming effect on page load
        window.onload = function () {
            // Show the dimming effect and the popup
            document.getElementById('page-dim').style.display = 'block';
            document.getElementById('popup-overlay').style.display = 'block';
            document.getElementById('popup-message').style.display = 'block';
        }
    </script>
</body>
</html>
