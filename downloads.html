<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Webpage</title>
    <style>
        /* General styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        /* Popup modal styles */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
        }

            .popup h2 {
                margin-top: 0;
            }

            .popup .close-btn {
                background-color: #f44336;
                color: white;
                border: none;
                padding: 10px;
                cursor: pointer;
                border-radius: 5px;
            }

                .popup .close-btn:hover {
                    background-color: #d32f2f;
                }

        /* Button to trigger popup */
        .trigger-popup {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

            .trigger-popup:hover {
                background-color: #45a049;
            }
    </style>
</head>
<body>

    <!-- Content of the page -->
    <h1>Welcome to My Website</h1>
    <p>Click the button below to open the popup modal.</p>
    <button class="trigger-popup" id="openPopupBtn">Open Popup</button>

    <!-- Popup modal -->
    <div class="popup" id="popupModal">
        <h2>Popup Title</h2>
        <p>This is a simple popup message.</p>
        <button class="close-btn" id="closePopupBtn">Close</button>
    </div>

    <script>
        // Get references to the button and popup
        const openPopupBtn = document.getElementById('openPopupBtn');
        const closePopupBtn = document.getElementById('closePopupBtn');
        const popupModal = document.getElementById('popupModal');

        // Open the popup when the button is clicked
        openPopupBtn.addEventListener('click', function () {
            popupModal.style.display = 'block';
        });

        // Close the popup when the close button is clicked
        closePopupBtn.addEventListener('click', function () {
            popupModal.style.display = 'none';
        });
    </script>
</body>
</html>
