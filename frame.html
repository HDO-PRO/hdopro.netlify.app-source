<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Mockup Frame Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
        }
        h1 {
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>Android Mockup Frame Generator</h1>
    <p>Using the Samsung Note 10 frame</p>
    <input type="file" id="imageUpload" accept="image/*">
    <canvas id="canvas" width="304" height="622"></canvas>
    <button id="downloadButton">Download Framed Image</button>

    <footer>
        <p>We do not collect data and we respect users' privacy.</p>
    </footer>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadButton = document.getElementById('downloadButton');

        const androidFrame = new Image();
        androidFrame.src = 'https://via.placeholder.com/304x622.png?text=Samsung+Note+10+Frame'; // Replace with your actual Samsung Note 10 frame image URL

        androidFrame.onload = () => {
            // Ensure the frame is drawn first
            ctx.drawImage(androidFrame, 0, 0, canvas.width, canvas.height);
        };

        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const uploadedImage = new Image();
                uploadedImage.onload = () => {
                    // Calculate aspect ratios
                    const frameAspectRatio = canvas.width / canvas.height;
                    const imageAspectRatio = uploadedImage.width / uploadedImage.height;

                    let sx, sy, sWidth, sHeight;

                    if (imageAspectRatio > frameAspectRatio) {
                        // Image is wider than frame
                        sHeight = uploadedImage.height;
                        sWidth = sHeight * frameAspectRatio;
                        sx = (uploadedImage.width - sWidth) / 2;
                        sy = 0;
                    } else {
                        // Image is taller than frame
                        sWidth = uploadedImage.width;
                        sHeight = sWidth / frameAspectRatio;
                        sx = 0;
                        sy = (uploadedImage.height - sHeight) / 2;
                    }

                    // Clear canvas and draw the uploaded image first
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(uploadedImage, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
                    
                    // Draw the Android frame on top
                    ctx.drawImage(androidFrame, 0, 0, canvas.width, canvas.height);
                };
                uploadedImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        downloadButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'framed-image.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
