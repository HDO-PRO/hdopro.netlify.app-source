<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Mockup Frame Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1c1c1c; /* Dark background with a slight purple tint */
            color: #e0e0e0;
            margin: 0;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #d8a1e2; /* Light purple for the header */
        }
        p {
            margin-bottom: 10px;
        }
        input[type="file"] {
            display: none;
        }
        .drop-zone {
            border: 2px dashed #555;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            width: 320px;
            height: 640px;
            margin: 20px;
            position: relative;
            overflow: hidden;
            background-color: #2a2a2a; /* Slightly lighter background for the drop zone */
        }
        .drop-zone.dragover {
            border-color: #d8a1e2; /* Light purple border when dragging over */
            background-color: rgba(216, 161, 226, 0.1);
        }
        canvas {
            border: 1px solid #ccc;
            margin-bottom: 20px;
            background-color: #121212;
            max-width: 100%;
            width: 320px;
            height: 640px;
        }
        button {
            padding: 10px 20px;
            background-color: #e74c3c; /* Red button color */
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #c0392b; /* Darker red on hover */
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>Android Mockup Frame Generator</h1>
    <p>Using the Samsung Note 10 frame</p>
    <p>Supported image formats: JPEG, PNG, GIF, BMP, WebP</p>
    <div class="drop-zone" id="dropZone">Drag and drop an image here or click to upload</div>
    <input type="file" id="imageUpload" accept="image/*">
    <canvas id="canvas" width="320" height="640"></canvas>
    <button id="downloadButton">Download Framed Image</button>

    <footer>
        <p>We do not collect data and we respect users' privacy.</p>
    </footer>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const dropZone = document.getElementById('dropZone');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadButton = document.getElementById('downloadButton');

        const androidFrame = new Image();
        androidFrame.src = 'Images/samsung-galaxy-note-10-aura-black.png'; // Replace with your actual Samsung Note 10 frame image URL

        // Draw the frame on the canvas
        const drawFrame = () => {
            ctx.drawImage(androidFrame, 0, 0, canvas.width, canvas.height);
        };

        // Draw the uploaded image within the frame
        const handleFile = (file) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const uploadedImage = new Image();
                uploadedImage.onload = () => {
                    // Clear canvas and draw the frame first
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawFrame();

                    // Calculate the aspect ratios
                    const frameAspectRatio = canvas.width / canvas.height;
                    const imageAspectRatio = uploadedImage.width / uploadedImage.height;

                    let sx, sy, sWidth, sHeight;

                    if (imageAspectRatio > frameAspectRatio) {
                        // Image is wider than frame
                        sWidth = uploadedImage.height * frameAspectRatio;
                        sHeight = uploadedImage.height;
                        sx = (uploadedImage.width - sWidth) / 2;
                        sy = 0;
                    } else {
                        // Image is taller than frame
                        sWidth = uploadedImage.width;
                        sHeight = uploadedImage.width / frameAspectRatio;
                        sx = 0;
                        sy = (uploadedImage.height - sHeight) / 2;
                    }

                    // Draw the cropped and scaled image within the frame area
                    ctx.drawImage(uploadedImage, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

                    // Draw the Android frame on top
                    drawFrame();
                };
                uploadedImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) handleFile(file);
        });

        dropZone.addEventListener('click', () => {
            imageUpload.click();
        });

        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.classList.remove('dragover');
            const file = event.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        downloadButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'framed-image.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        // Ensure frame is drawn initially
        androidFrame.onload = () => {
            drawFrame();
        };
    </script>
</body>
</html>
