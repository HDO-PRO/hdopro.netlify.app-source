<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Mockup Frame Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: url('Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp');
            background-size: cover;
            background-position: center;
            color: #e0e0e0;
            margin: 0;
            text-align: center;
            user-select: none;
        }
        h1 {
            margin-bottom: 20px;
            color: #d8a1e2;
        }
        p {
            margin-bottom: 10px;
        }
        .drop-zone {
            border: 2px dashed #555;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            width: 150px;
            height: 100px;
            margin: 20px;
            background-color: #2a2a2a;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drop-zone.dragover {
            border-color: #d8a1e2;
            background-color: rgba(216, 161, 226, 0.1);
        }
        canvas {
            border: 1px solid #ccc;
            margin-bottom: 20px;
            background-color: #121212;
            width: 600px; /* Adjusted for higher quality */
            height: 1200px; /* Adjusted for higher quality */
        }
        button {
            padding: 8px 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        button:hover {
            background-color: #c0392b;
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
        }
        footer p {
            font-weight: bold;
            text-decoration: underline;
            color: black;
            text-shadow: 0 0 2px white;
        }
    </style>
</head>
<body>
    <h1>Android Mockup Frame Generator</h1>
    <p>Using the Samsung Note 10 frame</p>
    <p>Supported image formats: JPEG, PNG, GIF, BMP, WebP</p>
    <div class="drop-zone" id="dropZone">Drag and drop an image here or click to upload</div>
    <input type="file" id="imageUpload" accept="image/*" style="display:none;">
    <canvas id="canvas"></canvas>
    <button id="downloadButton">Download Framed Image</button>

    <footer>
        <p>We do not collect data and we respect users privacy.</p>
    </footer>

    <script>
        // Disable right-click
        document.addEventListener('contextmenu', event => event.preventDefault());

        const imageUpload = document.getElementById('imageUpload');
        const dropZone = document.getElementById('dropZone');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadButton = document.getElementById('downloadButton');

        const androidFrame = new Image();
        androidFrame.src = 'Images/samsung-galaxy-note-10-aura-black.png'; // Replace with your actual Samsung Note 10 frame image URL

        const drawFrame = () => {
            ctx.drawImage(androidFrame, 0, 0, canvas.width, canvas.height);
        };

        const handleFile = (file) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const uploadedImage = new Image();
                uploadedImage.onload = () => {
                    canvas.width = 600;  // Ensure canvas size matches the frame
                    canvas.height = 1200;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawFrame();

                    const frameAspectRatio = canvas.width / canvas.height;
                    const imageAspectRatio = uploadedImage.width / uploadedImage.height;

                    let sx, sy, sWidth, sHeight;

                    if (imageAspectRatio > frameAspectRatio) {
                        sWidth = uploadedImage.height * frameAspectRatio;
                        sHeight = uploadedImage.height;
                        sx = (uploadedImage.width - sWidth) / 2;
                        sy = 0;
                    } else {
                        sWidth = uploadedImage.width;
                        sHeight = uploadedImage.width / frameAspectRatio;
                        sx = 0;
                        sy = (uploadedImage.height - sHeight) / 2;
                    }

                    ctx.drawImage(uploadedImage, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
                    drawFrame();
                };
                uploadedImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) handleFile(file);
        });

        dropZone.addEventListener('click', () => {
            imageUpload.click();
        });

        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.classList.remove('dragover');
            const file = event.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        downloadButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'framed-image.png';
            link.href = canvas.toDataURL('image/png'); // Ensure high-quality PNG output
            link.click();
        });

        androidFrame.onload = () => {
            canvas.width = 600;  // Ensure canvas size matches the frame
            canvas.height = 1200;
            drawFrame();
        };
    </script>
</body>
</html
