<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error: Page Not Found</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="path/to/logo.png" type="image/png"> <!-- Replace 'path/to/logo.png' with the actual path to your logo -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #333;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .gif-container {
            margin: 20px 0;
        }
        .gif-container img {
            width: 150px;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Error: Page Not Found</h1>
        <p>Sorry, the page you are looking for could not be found.</p>
        <p>Please check the URL in the address bar.</p>
        <div class="gif-container">
            <img id="animated-gif" src="/Images/150f78d18fd597611f77b4ae7d2f1f58.gif" alt="Dancing Cat GIF">
        </div>
    </div>

    <script>
        const gifs = [
            '/Images/150f78d18fd597611f77b4ae7d2f1f58.gif',
            '/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif'
        ];
        let currentIndex = 0;
        const gifElement = document.getElementById('animated-gif');

        function switchGif() {
            currentIndex = (currentIndex + 1) % gifs.length;
            gifElement.src = gifs[currentIndex];
        }

        // Switch GIF every 5 seconds
        setInterval(switchGif, 5000);
    </script>
</body>
</html>
