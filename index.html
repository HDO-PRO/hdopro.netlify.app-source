<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error: Page Not Found</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/Images/logo.png" type="image/png"> <!-- Updated path for favicon -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden; /* Hide scrollbars from animation */
        }
        h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(51, 51, 51, 0.8); /* Semi-transparent background */
            padding: 30px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3); /* Semi-transparent border */
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            position: relative; /* Position relative for overlaying mist */
            z-index: 1; /* Ensure container is above mist */
        }
        .gif-container {
            margin: 20px 0;
        }
        .gif-container img {
            width: 150px;
            height: auto;
            border-radius: 8px;
        }
        .mist {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/Images/mist.png') repeat; /* Path to your mist image */
            opacity: 0.5;
            pointer-events: none; /* Allow clicks through mist */
            z-index: 0; /* Ensure mist is behind container */
            animation: moveMist 60s linear infinite; /* Animate mist */
        }
        @keyframes moveMist {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }
    </style>
</head>
<body>
    <div class="mist"></div> <!-- Mist overlay -->
    <div class="container">
        <h1>Error: Page Not Found</h1>
        <p>Sorry, the page you are looking for could not be found.</p>
        <p>Please check the URL in the address bar.</p>
        <div class="gif-container">
            <img id="animated-gif" src="" alt="Dancing Cat GIF">
        </div>
    </div>

    <script>
        const gifs = [
            '/Images/150f78d18fd597611f77b4ae7d2f1f58.gif',
            '/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif'
        ];
        
        const gifElement = document.getElementById('animated-gif');

        function getRandomIndex() {
            return Math.floor(Math.random() * gifs.length);
        }

        function switchGif() {
            gifElement.src = gifs[getRandomIndex()];
        }

        // Set initial GIF randomly on page load
        switchGif();

        // Switch GIF every 5 minutes (300,000 milliseconds)
        setInterval(switchGif, 300000);
    </script>
</body>
</html>
