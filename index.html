<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where am I?</title>
    <meta property="og:url" content="/index" />
    <meta property="og:title" content="HDO Pro | Weird">
    <meta property="og:description" content="Weird page of HDO Pro.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .github-button {
            padding: 10px 20px;
            font-size: 16px;
            color: purple;
            background-color: white;
            border: 2px solid purple;
            border-radius: 5px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .github-button:hover {
            background-color: purple;
            color: white;
        }

        @media (prefers-color-scheme: dark) {
            .github-button {
                color: #bb86fc;
                background-color: #333333;
                border: 2px solid #bb86fc;
            }

            .github-button:hover {
                background-color: #bb86fc;
                color: #333333;
            }
        }
    </style>
</head>
<body>
    <button class="github-button" onclick="openGitHub()">Check Out Our GitHub</button>

    <div class="mist"></div>
    <div class="container">
        <h1>Welcome!</h1>
        <p>"When you’re in trouble, you need to rely on your friends. Don’t worry, I’m here for you." - Muta</p>
        <p>Please check the URL in the address bar.</p>
        <p>What you're looking for may not be here.</p>
        <div class="gif-container">
            <img id="animated-gif" src="" alt="Dancing Cat GIF" onclick="handleGifClick()">
            <div id="speech-bubble" class="speech-bubble"></div>
        </div>
        <div class="loading-dots">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <script>
        const gifs = [
            '/Images/150f78d18fd597611f77b4ae7d2f1f58.gif',
            '/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif'
        ];
        
        const gifElement = document.getElementById('animated-gif');
        const speechBubble = document.getElementById('speech-bubble');
        let clickCount = 0;

        function getRandomIndex() {
            return Math.floor(Math.random() * gifs.length);
        }

        function switchGif() {
            gifElement.src = gifs[getRandomIndex()];
        }

        function handleGifClick() {
            clickCount++;
            if (clickCount === 1) {
                // Do nothing on the first click
            } else if (clickCount === 2) {
                speechBubble.innerText = 'Treats?';
                speechBubble.style.display = 'block'; // Show "Treats" speech bubble on second click
            } else if (clickCount === 3) {
                speechBubble.innerText = 'Invites?';
                // No action needed on third click
            } else if (clickCount === 4) {
                window.location.href = 'https://hdopro.netlify.app/invite'; // Redirect on fourth click
            }
        }

        function openGitHub() {
            const width = 800;
            const height = 600;
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;
            window.open(
                'https://github.com/HDO-PRO',
                'GitHubWindow',
                `width=${width},height=${height},top=${top},left=${left},resizable=yes`
            );
        }

        // Set initial GIF randomly on page load
        switchGif();

        // Switch GIF every 5 minutes (300,000 milliseconds)
        setInterval(switchGif, 300000);
    </script>
</body>
</html>
