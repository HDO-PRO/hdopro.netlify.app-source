<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error: Page Not Found</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #ddd; /* Light gray for better contrast with dark purple */
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(75, 0, 130, 0.8); /* Dark purple background */
            padding: 30px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3); /* Semi-transparent border */
            box-shadow: 0 0 10px rgba(128, 0, 128, 0.3); /* Dark purple shadow */
        }
        .gif-container {
            margin: 20px 0;
        }
        .gif-container img {
            width: 150px;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Error: Page Not Found</h1>
        <p>Sorry, the page you are looking for could not be found.</p>
        <p>Please check the URL in the address bar.</p>
        <div class="gif-container">
            <img id="animated-gif" src="" alt="Dancing Cat GIF">
        </div>
    </div>

    <script>
        const gifs = [
            '/Images/150f78d18fd597611f77b4ae7d2f1f58.gif',
            '/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif'
        ];
        
        const gifElement = document.getElementById('animated-gif');

        function getRandomIndex() {
            return Math.floor(Math.random() * gifs.length);
        }

        function switchGif() {
            gifElement.src = gifs[getRandomIndex()];
        }

        // Set initial GIF randomly on page load
        switchGif();

        // Switch GIF every 5 minutes (300,000 milliseconds)
        setInterval(switchGif, 300000);
    </script>
</body>
</html>
