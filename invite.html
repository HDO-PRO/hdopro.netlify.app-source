<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro | Invitations</title>
    <meta property="og:url" content="/invite" />
    <meta property="og:title" content="HDO Pro | Invitations">
    <meta property="og:description" content="Invite others to HDO Pro.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('Images/modern layout two.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .mist {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/Images/mist.png') repeat;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            animation: moveMist 60s linear infinite;
        }

        @keyframes moveMist {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 90%;
            width: 400px;
            background-color: rgba(51, 51, 51, 0.8);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ddd;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .button-container a {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-decoration: none;
            color: #fff;
            background-color: #7289DA;
            border-radius: 5px;
            padding: 10px;
            width: calc(33% - 20px);
            min-width: 120px;
            max-width: 150px;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .button-container a:hover {
            background-color: #677BC4;
        }

        .button-container img {
            width: 24px;
            height: 24px;
            margin-bottom: 5px;
        }

        .gif-container img {
            width: 150px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .gif-container img.tapped {
            border-color: #ff66b2;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .loading-dots div {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            margin: 0 3px;
            animation: dot-blink 1.5s infinite ease-in-out;
        }

        .loading-dots div:nth-child(2) {
            animation-delay: 0.3s;
        }

        .loading-dots div:nth-child(3) {
            animation-delay: 0.6s;
        }

        .notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(200, 0, 0, 0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 3000;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            text-align: center;
        }

        @keyframes dot-blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        #verify-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #verify-box {
            background: rgba(51, 51, 51, 0.95);
            border: 2px solid #ff66b2;
            border-radius: 12px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
            text-align: center;
        }

        #verify-box h2 {
            color: #ff66b2;
            margin: 0 0 16px;
            font-size: 1.3rem;
        }

        #verify-box p {
            color: #fff;
            font-size: 14px;
            margin: 8px 0;
        }

        #verify-box input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ff66b2;
            border-radius: 6px;
            background: #000;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        #verify-box button {
            background: #ff66b2;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }

        #verify-box button:hover { background: #e05599; }

        #verify-error {
            color: #ff5555;
            font-size: 13px;
            min-height: 1.2em;
            margin-top: 8px;
        }

        #terminal-link {
            color: #ff66b2;
            text-decoration: underline;
            cursor: pointer;
        }

        @media screen and (max-width: 768px) {
            .container { width: 90%; }
            .button-container a { width: calc(50% - 20px); }
        }

        @media screen and (max-width: 480px) {
            .button-container a { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="mist"></div>
    <div class="container">
        <h1>HDO Pro Invitations</h1>
        <p>Invite others to join HDO Pro.</p>
        <p>Please note that invites can open and close at any time.</p>
        <p>Access the <a href="/terminal" style="color: #ff66b2;">HDO Pro Terminal</a>.</p>
        <div class="gif-container">
            <img id="animated-gif" src="" alt="Dancing Cat GIF" data-href="/h0m3">
        </div>
        <div class="loading-dots">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="button-container">
            <a href="/game" aria-label="Play the HDO Pro arcade game">
                <img src="/Images/logo.png" alt="Arcade" style="width:48px;height:48px;">
                Play Arcade
            </a>

            <a href="https://discord.gg/BbJaESA5N" target="_blank">
                <img src="/Images/discord.png" alt="Discord">
                Join us on Discord
            </a>

            <a href="javascript:void(0)" onclick="showTelegramNotification()">
                <img src="/Images/telegram.png" alt="Telegram">
                Join us on Telegram
            </a>

            <a href="https://forms.gle/HTxApPVkDmhhWLxGA" target="_blank">
                <img src="/Images/7257807.png" alt="Message Form">
                Message Form
            </a>
        </div>
    </div>
    <div id="telegram-notification" class="notification">
        Invite not available at this time.
    </div>

    <div id="verify-overlay">
        <div id="verify-box">
            <h2>Verify Access</h2>
            <p>Solve the puzzle:</p>
            <p id="puzzle-question">What is 7 + 5?</p>
            <input type="text" id="puzzle-answer" placeholder="Answer" autocomplete="off">
            <input type="password" id="terminal-password" placeholder="Terminal password">
            <button id="verify-submit">Submit</button>
            <p id="verify-error"></p>
        </div>
    </div>

    <script>
        const gifs = [
            '/Images/150f78d18fd597611f77b4ae7d2f1f58.gif',
            '/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif'
        ];

        const gifElement = document.getElementById('animated-gif');
        const overlay = document.getElementById('verify-overlay');
        const puzzleAnswer = document.getElementById('puzzle-answer');
        const passwordInput = document.getElementById('terminal-password');
        const verifyError = document.getElementById('verify-error');

        let catClicks = 0;
        const PUZZLE = { q: 'What is 7 + 5?', a: '12' };
        const TERM_PASSWORD = 'neko';

        function getRandomIndex() {
            return Math.floor(Math.random() * gifs.length);
        }

        function switchGif() {
            gifElement.src = gifs[getRandomIndex()];
        }

        function showTelegramNotification() {
            const notification = document.getElementById('telegram-notification');
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 3000);
        }

        function openVerify() {
            puzzleAnswer.value = '';
            passwordInput.value = '';
            verifyError.textContent = '';
            overlay.style.display = 'flex';
            puzzleAnswer.focus();
        }

        function closeVerify() {
            overlay.style.display = 'none';
        }

        function checkVerify() {
            const answer = puzzleAnswer.value.trim();
            const pass = passwordInput.value.trim();

            if (answer !== PUZZLE.a) {
                verifyError.textContent = 'Puzzle answer is wrong.';
                return;
            }
            if (pass !== TERM_PASSWORD) {
                verifyError.textContent = 'Terminal password is wrong.';
                return;
            }

            window.location.href = gifElement.dataset.href;
            closeVerify();
        }

        gifElement.addEventListener('click', () => {
            catClicks++;
            gifElement.classList.add('tapped');
            setTimeout(() => gifElement.classList.remove('tapped'), 150);

            if (catClicks >= 6) {
                catClicks = 0;
                openVerify();
            }
        });

        document.getElementById('verify-submit').addEventListener('click', checkVerify);
        passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') checkVerify(); });
        puzzleAnswer.addEventListener('keypress', e => { if (e.key === 'Enter') passwordInput.focus(); });

        overlay.addEventListener('click', e => {
            if (e.target === overlay) closeVerify();
        });

        switchGif();
        setInterval(switchGif, 300000);
    </script>
    <canvas id="hdo-pixels" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></canvas>
    <script src="pixels.js" defer></script>
</body>
</html>
