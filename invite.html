<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro | Invitations</title>
    <meta property="og:url" content="/invite" />
    <meta property="og:title" content="HDO Pro | Invitations">
    <meta property="og:description" content="Invite others to HDO Pro.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
        }

        .mist {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/Images/mist.png') repeat;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            animation: moveMist 60s linear infinite;
        }

        @keyframes moveMist {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 90%;
            width: 400px;
            background-color: rgba(51, 51, 51, 0.8);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ddd;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .button-container a {
            display: inline-block;
            margin: 0 10px;
            text-decoration: none;
            color: #fff;
            background-color: #7289DA;
            border-radius: 5px;
            padding: 10px 20px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .button-container a:hover {
            background-color: #677BC4;
        }

        .button-container img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .gif-container img {
            width: 150px; /* Adjust the width of the GIF */
            border-radius: 8px;
            cursor: pointer;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .loading-dots div {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            margin: 0 3px;
            animation: dot-blink 1.5s infinite ease-in-out;
        }

        .loading-dots div:nth-child(2) {
            animation-delay: 0.3s;
        }

        .loading-dots div:nth-child(3) {
            animation-delay: 0.6s;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }

        @keyframes dot-blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="mist"></div>
    <div class="container">
        <h1>HDO Pro Invitations</h1>
        <p>Invite others to join HDO Pro.</p>
        <p>Please note that invites can open and close at any time.</p>
        <!-- GIF and loading dots container -->
        <div class="gif-container">
            <img id="animated-gif" src="" alt="Dancing Cat GIF" onclick="redirectToHome()">
        </div>
        <div class="loading-dots">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <!-- Button container for Discord and Telegram -->
        <div class="button-container">
            <a href="https://discord.gg/Z3Qb5se8" target="_blank">
                <img src="/Images/discord.png" alt="Discord">
                Join us on Discord
            </a>
            <a href="javascript:void(0)" onclick="showTelegramNotification()">
                <img src="/Images/telegram.png" alt="Telegram">
                Join us on Telegram
            </a>
        </div>
    </div>

    <!-- Notification for Telegram invite -->
    <div id="telegram-notification" class="notification">
        Invite not available at this time.
    </div>

    <script>
        const gifs = [
            '/Images/150f78d18fd597611f77b4ae7d2f1f58.gif',
            '/Images/8e752cf446947d3d01c0eaaf9e1504e2.gif'
        ];
        
        const gifElement = document.getElementById('animated-gif');

        function getRandomIndex() {
            return Math.floor(Math.random() * gifs.length);
        }

        function switchGif() {
            gifElement.src = gifs[getRandomIndex()];
        }

        function redirectToHome() {
            window.location.href = 'https://hdopro.netlify.app/';
        }

        // Set initial GIF randomly on page load
        switchGif();

        // Switch GIF every 5 minutes (300,000 milliseconds)
        setInterval(switchGif, 300000);

        // Show Telegram invite not available notification
        function showTelegramNotification() {
            const notification = document.getElementById('telegram-notification');
            notification.style.display = 'block';
            setTimeout(function() {
                notification.style.display = 'none';
            }, 3000); // 3000 milliseconds = 3 seconds
        }

        // Disable right-click and text selection
          document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
          });
        
          document.addEventListener('keydown', function (e) {
            if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 86 || e.keyCode === 85 || e.keyCode === 117)) {
                e.preventDefault();
            }
          });
        
          document.addEventListener('selectstart', function (e) {
            e.preventDefault();
          });
        
          // Prevent dev tools inspection
          document.addEventListener('keydown', function (e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73)) {
              e.preventDefault();
            }
          });
        
          // Alert message on inspect element
            window.addEventListener('devtoolschange', function(event) {
              document.body.style.display = 'none';
              alert('Please respect our work! Do not inspect the page.');
            });
    </script>
</body>
</html>
