<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Runner Game</title>
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
        }

        .mist {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/Images/mist.png') repeat;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            animation: moveMist 60s linear infinite;
        }

        @keyframes moveMist {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 90%;
            width: 600px;
            background-color: rgba(51, 51, 51, 0.8);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ddd;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 400px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(51, 51, 51, 0.8);
            overflow: hidden;
        }

        .cat {
            position: absolute;
            bottom: 20px;
            left: 50px;
            width: 50px;
            height: 50px;
            background: url('/Images/animated-cat.gif') no-repeat center center;
            background-size: contain;
        }

        .obstacle {
            position: absolute;
            bottom: 20px;
            right: 0;
            width: 30px;
            height: 30px;
            background: url('/Images/obstacle.png') no-repeat center center;
            background-size: contain;
        }

        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }

        .game-over h2 {
            margin: 0;
            color: #fff;
        }

        .game-over button {
            background-color: #4CAF50; /* Green background */
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .game-over button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="mist"></div>
    <div class="container">
        <h1>Cat Runner Game</h1>
        <p>Use the space bar to jump over obstacles. Click on the game area to start.</p>
        <div class="game-container" id="gameContainer">
            <div class="cat" id="cat"></div>
            <div class="obstacle" id="obstacle"></div>
            <div class="game-over" id="gameOver">
                <h2>Game Over</h2>
                <button onclick="restartGame()">Restart</button>
            </div>
        </div>
    </div>

    <script>
        let cat = document.getElementById('cat');
        let obstacle = document.getElementById('obstacle');
        let gameOverDiv = document.getElementById('gameOver');
        let gameContainer = document.getElementById('gameContainer');

        let isJumping = false;
        let isGameOver = false;
        let obstacleInterval;
        let jumpTimeout;

        function startGame() {
            if (isGameOver) {
                resetGame();
            }
            isGameOver = false;
            obstacle.style.right = '0';
            obstacleInterval = setInterval(moveObstacle, 10);
        }

        function moveObstacle() {
            let obstaclePosition = parseInt(window.getComputedStyle(obstacle).right);

            if (obstaclePosition > gameContainer.clientWidth) {
                obstacle.style.right = '0';
            } else {
                obstacle.style.right = (obstaclePosition + 5) + 'px';
            }

            if (!isJumping && obstaclePosition < 60 && obstaclePosition > 0) {
                gameOver();
            }
        }

        function jump() {
            if (isJumping || isGameOver) return;

            isJumping = true;
            cat.style.bottom = '150px';
            jumpTimeout = setTimeout(() => {
                cat.style.bottom = '20px';
                isJumping = false;
            }, 500);
        }

        function gameOver() {
            clearInterval(obstacleInterval);
            isGameOver = true;
            gameOverDiv.style.display = 'block';
        }

        function restartGame() {
            gameOverDiv.style.display = 'none';
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });

        gameContainer.addEventListener('click', startGame);

        // Prevent right-click and context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Disable F12 and other developer tools access
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'I' || e.key === 'U' || e.key === 'C'))) {
                e.preventDefault();
            }
        });

        // Start the game when the page loads
        startGame();
    </script>
</body>
</html>
