<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App - Tachiomi Style</title>
    <link rel="icon" href="images/f16a67b93d7e7c64355e35851377e1eb.jpg">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            background-color: #1e1e1e;
            padding: 1rem;
            border-bottom: 2px solid #6a1b9a;
        }

        header h1 {
            font-size: 2rem;
            color: #ba68c8;
            letter-spacing: 1px;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }

        .search-bar input {
            width: 80%;
            max-width: 400px;
            padding: 0.5rem;
            border: 1px solid #6a1b9a;
            border-radius: 4px;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }

        .movie-card {
            background-color: #1e1e1e;
            padding: 0.5rem;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s;
        }

        .movie-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .movie-card h3 {
            margin: 0.5rem 0;
            font-size: 1rem;
            color: #ba68c8;
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #1e1e1e;
            border-top: 2px solid #6a1b9a;
        }

        footer p {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Movie App</h1>
    </header>

    <!-- Search Bar -->
    <div class="search-bar">
        <input type="text" placeholder="Search for movies...">
    </div>

    <!-- Movie Grid -->
    <section class="container">
        <!-- Example Movie Cards -->
        <div class="movie-card">
            <img src="https://via.placeholder.com/150x220" alt="Movie Poster">
            <h3>Movie Title</h3>
        </div>
        <div class="movie-card">
            <img src="https://via.placeholder.com/150x220" alt="Movie Poster">
            <h3>Another Movie</h3>
        </div>
        <div class="movie-card">
            <img src="https://via.placeholder.com/150x220" alt="Movie Poster">
            <h3>Cool Movie</h3>
        </div>
        <!-- Add more movie cards here -->
    </section>

    <footer>
        <p>&copy; 2024 Movie App | Dark Mode Design</p>
    </footer>
</body>
</html>
