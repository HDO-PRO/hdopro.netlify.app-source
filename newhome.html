<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro - Private Community</title>
    <meta property="og:url" content="/home" />
    <meta property="og:title" content="HDO Pro | Home">
    <meta property="og:description" content="Homepage of HDO Pro.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />

    <!-- External Scripts and Styles -->
    <script src="index.js" type="text/javascript"></script>
    <link rel="manifest" href="/manifest.json">
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/Images/logo.png" type="image/png">

    <!-- Custom Styles -->
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            user-select: none; /* Prevent text highlighting */
        }

        body {
            background: linear-gradient(to bottom, #1a001a, #290029);
            color: white;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(to right, #1a001a, #440044, #1a001a);
            border-bottom: 1px solid #442044;
        }

        header .logo {
            color: #ff66b2;
            font-weight: bold;
            font-size: 1.5em;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin: 0 10px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ff66b2;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            transition: transform 0.3s ease;
        }

        /* Side Menu */
        .side-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 250px;
            height: 100%;
            background-color: #1a001a;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.5);
            transition: right 0.3s ease;
            padding: 20px;
            z-index: 1000;
        }

        .side-menu.open {
            right: 0;
        }

        .side-menu .close-btn {
            text-align: right;
            font-size: 1.5em;
            color: #ff66b2;
            cursor: pointer;
        }

        .side-menu ul {
            list-style: none;
            margin-top: 20px;
        }

        .side-menu ul li {
            margin: 15px 0;
        }

        .side-menu ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }

        .side-menu ul li a:hover {
            color: #ff66b2;
        }

        /* Prevent text highlighting */
        body, button {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">HDO Pro</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Trending</a></li>
                <li><a href="#">Favorites</a></li>
            </ul>
        </nav>
        <!-- Hamburger Icon -->
        <div class="hamburger" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Trending</a></li>
            <li><a href="#">Favorites</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Discover Your Favorite Movies</h1>
        <p>Stream and explore the latest movies, TV shows, and more in one place.</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 HDO Pro | Private Community</p>
    </footer>

    <!-- JavaScript to Disable Developer Tools -->
    <script>
        // Disable right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Disable text selection
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });

        // Disable copying
        document.addEventListener('copy', function(e) {
            e.preventDefault();
        });

        // Block access to developer tools
        (function blockDevTools() {
            document.onkeydown = function (e) {
                if (
                    e.ctrlKey && 
                    (e.key === "u" || e.key === "U" || e.key === "s" || e.key === "S" || e.key === "i" || e.key === "I") || 
                    e.key === "F12" || 
                    (e.ctrlKey && e.shiftKey && (e.key === "J" || e.key === "C")) ||
                    (e.metaKey && (e.key === "S" || e.key === "I"))
                ) {
                    e.preventDefault();
                    return false;
                }
            };
        })();

        // Side Menu Toggle
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('open');
        }
    </script>
</body>
</html>
