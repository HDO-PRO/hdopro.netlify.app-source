<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro - Private Community</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            user-select: none; /* Disable text selection */
        }

        body {
            background: linear-gradient(to bottom, #1a001a, #290029);
            color: white;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(to right, #1a001a, #440044, #1a001a);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        header .logo {
            color: #ff66b2;
            font-weight: bold;
            font-size: 1.5em;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin-left: auto; /* Align menu items to the right */
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1em;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ff66b2;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav ul {
                display: none;
            }

            .hamburger {
                display: block;
            }
        }

        .hamburger {
            display: none;
            cursor: pointer;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background: white;
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">HDO Pro</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Trending</a></li>
                <li><a href="#">Favorites</a></li>
            </ul>
        </nav>
    </header>

    <script>
        // Prevent right-click context menu
        document.addEventListener("contextmenu", (e) => {
            e.preventDefault();
        });

        // Prevent text selection
        document.addEventListener("selectstart", (e) => {
            e.preventDefault();
        });

        // Prevent key combinations for Developer Tools
        document.addEventListener("keydown", (e) => {
            // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) ||
                (e.ctrlKey && e.key === "U")
            ) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
