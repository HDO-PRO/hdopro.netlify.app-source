<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro | Player</title>
    <meta property="og:url" content="/player" />
    <meta property="og:title" content="HDO Pro | Player">
    <meta property="og:description" content="Download the Media Player of HDO Pro.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 380px;
            padding: 28px;
            border-radius: 12px;
            text-align: center;
        }
        .card h1 {
            margin: 0 0 10px;
            font-size: 1.4rem;
        }
        .card p {
            margin: 8px 0;
            color: #ddd;
        }
        .puzzle input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ff66b2;
            border-radius: 6px;
            background: #000;
            color: #fff;
            text-align: center;
            font-size: 1rem;
            box-sizing: border-box;
            margin: 12px 0 8px;
        }
        .puzzle button {
            background: #ff66b2;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .puzzle button:hover {
            background: #e05599;
        }
        .error {
            color: #ff5555;
            min-height: 1.2em;
            font-size: 0.9rem;
        }
        .fallback a {
            color: #ff66b2;
        }
        @media (max-width: 480px) {
            .card { padding: 20px; }
            .card h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <main class="card hdo-glass">
        <h1>Media Player</h1>
        <p id="status">Solve this quick puzzle to continue.</p>
        <div class="puzzle">
            <p id="question">Loading puzzle...</p>
            <input type="text" id="answer" autocomplete="off" placeholder="Answer">
            <p id="error" class="error" aria-live="assertive"></p>
            <button id="submit" type="button">Continue</button>
        </div>
        <noscript>
            <p class="fallback">JavaScript is required for the puzzle gate. <a href="https://github.com/MarshMeadow/nothing/releases/download/all_in_one_3/com.mediaon.apt-34.apk">Continue manually</a>.</p>
        </noscript>
    </main>
    <script>
        (function() {
            const target = 'https://github.com/MarshMeadow/nothing/releases/download/all_in_one_3/com.mediaon.apt-34.apk';
            if (localStorage.getItem('hdo-master') === '1') { window.location.href = target; return; }
            const TERMINAL_CODE = 'n3k0';
            let stage = 'puzzle';
            let answer;

            function makePuzzle() {
                let q, a;
                if (Math.random() < 0.5) {
                    const x = Math.floor(Math.random() * 11) + 2;
                    const y = Math.floor(Math.random() * 11) + 2;
                    q = 'What is ' + x + ' + ' + y + '?';
                    a = x + y;
                } else {
                    const x = Math.floor(Math.random() * 10) + 3;
                    const y = Math.floor(Math.random() * (x - 2)) + 2;
                    q = 'What is ' + x + ' − ' + y + '?';
                    a = x - y;
                }
                answer = a;
                document.getElementById('question').textContent = q;
                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
                document.getElementById('status').textContent = 'Solve this quick puzzle to continue.';
                stage = 'puzzle';
            }

            function showTerminal() {
                stage = 'terminal';
                document.getElementById('question').textContent = 'Enter the terminal code.';
                document.getElementById('answer').value = '';
                document.getElementById('answer').placeholder = 'Terminal code';
                document.getElementById('answer').focus();
                document.getElementById('status').textContent = 'Enter the terminal code to continue.';
            }

            function check() {
                const input = document.getElementById('answer');
                const error = document.getElementById('error');
                const val = input.value.trim();
                if (stage === 'puzzle') {
                    if (parseInt(val, 10) === answer) {
                        error.textContent = '';
                        showTerminal();
                    } else {
                        error.textContent = 'Wrong answer. Try again.';
                        input.select();
                    }
                } else if (stage === 'terminal') {
                    if (val.toLowerCase() === TERMINAL_CODE) {
                        window.location.href = target;
                    } else {
                        error.textContent = 'Wrong terminal code. Try again.';
                        input.value = '';
                        input.focus();
                    }
                }
            }

            document.getElementById('answer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') check();
            });
            document.getElementById('submit').addEventListener('click', check);
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            makePuzzle();
        })();
    </script>
</body>
</html>
