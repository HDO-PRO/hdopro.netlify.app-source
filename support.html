<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - HDO Pro</title>
<meta property="og:url" content="/support" />
<meta property="og:title" content="HDO Pro | Support">
<meta property="og:description" content="Need Support? Contact us.">
<meta property="og:image" content="/images/logo.png">
<meta property="og:image:type" content="image/png">
<meta name="theme-color" content="#8d2249" />
<link href="style.css" rel="stylesheet" type="text/css" />
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
    background-image: url('Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: rgba(49, 21, 75, 0.8); /* Purple with transparency */
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    position: relative;
    text-align: center;
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  .notification {
    background-color: rgba(49, 21, 75, 0.8); /* Purple with transparency */
    color: #ffc0cb;
    padding: 10px;
    text-align: center;
    margin-bottom: 20px;
  }

  .email-button {
    background-color: #7289da;
    color: #ffffff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    text-decoration: none;
    display: inline-block;
  }

  .email-button:hover {
    background-color: #677bc4;
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black overlay */
  }

  .modal-content {
    background-color: rgba(49, 21, 75, 0.9); /* Purple with transparency */
    color: #ffc0cb;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    width: 300px;
    padding: 20px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .modal-content button {
    background-color: #7289da;
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .modal-content button:hover {
    background-color: #677bc4;
  }

  p {
    margin-bottom: 10px;
  }
</style>
<script>
  // Function to close the modal
  function closeModal() {
    document.getElementById('humanCheckModal').style.display = 'none';
  }

  // Function to display the modal
  function showModal() {
    document.getElementById('humanCheckModal').style.display = 'block';
  }

  window.onload = function() {
    showModal();
  }

  // Prevent right-click context menu
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Prevent copying
  document.addEventListener('copy', function(e) {
    e.preventDefault();
  });

  // Check for developer tools
  function detectDevTools() {
    const threshold = 160;
    let start = performance.now();
    debugger;
    let end = performance.now();
    if (end - start > threshold) {
      window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // Rick Roll
    }
  }

  // Event listeners to detect key combinations
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.shiftKey) && (e.keyCode == 73 || e.keyCode == 105)) {
      window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // Rick Roll
    }
  });

  // Disable text selection
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // Rick Roll
    }
  });

  window.onload = function() {
    showModal();
    detectDevTools(); // Check for developer tools on page load
  }
</script>
</head>
<body>
<!-- Modal -->
<div id="humanCheckModal" class="modal">
  <div class="modal-content">
    <h2>Are you human?</h2>
    <button onclick="closeModal()">Yes, I am human</button>
  </div>
</div>

<div class="container">
  <h1>Contact Us</h1>
  <div class="notification">
    <p>This is meant to be opened on mobile.</p>
  </div>
  <a href="mailto:hdopro@protonmail.com" class="email-button">Email Us</a>
</div>
</body>
</html>
