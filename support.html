<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - HDO Pro</title>
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
    background-image: url('Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: #38124b;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    position: relative;
    text-align: center;
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  p {
    margin-bottom: 10px;
  }

  /* Support Button */
  .support-btn {
    display: inline-block;
    background-color: #7289da;
    color: #ffffff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 5px;
    transition: background-color 0.3s ease;
    cursor: pointer;
  }

  .support-btn:hover {
    background-color: #677bc4;
  }

  /* Social Media Icons */
  .social-icons {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .social-icons img {
    width: 40px;
    height: 40px;
    margin: 0 10px;
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Modal Styling */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
  }

  .modal-content {
    background-color: #38124b;
    color: #ffc0cb;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    width: 300px;
    padding: 20px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .modal-content button {
    background-color: #7289da;
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .modal-content button:hover {
    background-color: #677bc4;
  }
</style>
</head>
<body>
<!-- Modal -->
<div id="humanCheckModal" class="modal">
  <div class="modal-content">
    <h2>Are you human?</h2>
    <button onclick="closeModal()">Yes, I am human</button>
  </div>
</div>

<div class="container">
  <h1>Support</h1>
  <p>Need help or assistance? Contact our support team.</p>
  <p>This page is optimized for mobile devices.</p>
  <button class="support-btn" onclick="window.location.href='mailto:hdopro@protonmail.com';">Email Support</button>
</div>

<div class="social-icons">
  <!-- Placeholder images (replace with actual social icons) -->
  <img src="path/to/facebook-logo.png" alt="Facebook">
  <img src="path/to/twitter-logo.png" alt="Twitter">
  <img src="path/to/instagram-logo.png" alt="Instagram">
  <img src="path/to/linkedin-logo.png" alt="LinkedIn">
</div>

<script>
  function closeModal() {
    document.getElementById('humanCheckModal').style.display = 'none';
  }

  window.onload = function() {
    document.getElementById('humanCheckModal').style.display = 'block';
  }
</script>
</body>
</html>
