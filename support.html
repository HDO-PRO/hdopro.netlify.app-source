<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - HDO Pro</title>
<link href="style.css" rel="stylesheet" type="text/css" />
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: #38124b;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  p {
    margin-bottom: 10px;
  }

  /* Modal Styling */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
  }

  .modal-content {
    background-color: #38124b;
    color: #ffc0cb;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    width: 300px;
    padding: 20px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .modal-content button {
    background-color: #7289da;
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .modal-content button:hover {
    background-color: #677bc4;
  }
</style>
<script>
  // Function to close the modal
  function closeModal() {
    document.getElementById('humanCheckModal').style.display = 'none';
  }

  // Function to redirect to Rick Roll
  function redirectToRickRoll() {
    window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
  }

  // Check for developer tools
  function detectDevTools() {
    const threshold = 160;
    let start = performance.now();
    debugger;
    let end = performance.now();
    if (end - start > threshold) {
      redirectToRickRoll();
    }
  }

  // Event listeners to detect key combinations
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.shiftKey) && (e.keyCode == 73 || e.keyCode == 105)) {
      redirectToRickRoll();
    }
  });

  // Prevent right-click context menu
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    redirectToRickRoll();
  });

  // Disable text selection
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      redirectToRickRoll();
    }
  });

  // Function to handle form submission (replace with actual logic)
  document.addEventListener("DOMContentLoaded", function() {
    var form = document.querySelector("form");
    form.addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent default form submission

      // Display human check modal
      document.getElementById('humanCheckModal').style.display = 'block';
    });

    window.onload = function() {
      detectDevTools(); // Check for developer tools on page load
    }
  });
</script>
</head>
<body>
<!-- Modal -->
<div id="humanCheckModal" class="modal">
  <div class="modal-content">
    <h2>Are you human?</h2>
    <button onclick="closeModal()">Yes, I am human</button>
  </div>
</div>

<div class="container">
  <h1>Support</h1>
  <p>This is the support page of HDO Pro.</p>
  <p>Have questions or need assistance? Contact us.</p>
  <form action="send_support_email.php" method="post">
    <input type="text" name="name" placeholder="Your Name" required><br>
    <input type="email" name="email" placeholder="Your Email" required><br>
    <textarea name="message" rows="4" placeholder="Your Message" required></textarea><br>
    <input type="submit" value="Submit">
  </form>
</div>

</body>
</html>
