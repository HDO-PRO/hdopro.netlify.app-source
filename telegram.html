<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:url" content="/telegram" />
<title>HDO Pro - Telegram</title>
<link href="style.css" rel="stylesheet" type="text/css" />
<link rel="icon" href="/images/logo.png" type="image/png">
<style>
  body {
    background-color: #3a1653;
    color: #ffc0cb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    position: relative;
    background-image: url('Images/purple-japanese-painting-ai-generated-1920x1080-v0-0y2eb9annv3b1.webp');
    background-size: cover;
    background-repeat: no-repeat;
  }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: rgba(56, 18, 75, 0.7); /* Telegram light theme background color with transparency */
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    text-align: center;
    position: relative;
    z-index: 1; /* Ensure content is above the blurred background */
  }

  h1 {
    color: #ffc0cb;
    margin-top: 20px;
  }

  p {
    margin-bottom: 10px;
    color: #ffc0cb;
  }

</style>
</head>
<body>
<div class="container">
  <h1>Join HDO Pro on Telegram</h1>
  <p>Sorry, the invite link is not available at this time. Please join our Discord to get access.</p>
</div>

<script>
  // Disable right-click
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Disable text selection
  document.addEventListener('selectstart', function(e) {
    e.preventDefault();
  });

  // Disable developer tools
  document.onkeydown = function(e) {
    if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 123)) {
      return false;
    }
  };

  // Alert message on inspect element
  window.addEventListener('devtoolschange', function(event) {
    document.body.style.display = 'none';
    alert('Please respect our work! Do not inspect the page.');
  });
</script>
</body>
</html>
