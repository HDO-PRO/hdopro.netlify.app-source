<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal For HDO Pro">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #terminal {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .line span {
            color: #00ff00;
        }

        /* Download Link Styles */
        a.download-link {
            color: #ff5e9c; /* Reddish-pink color */
            text-decoration: none;
            font-weight: bold;
        }

        a.download-link:hover {
            text-decoration: underline;
        }

        /* Input Section Styles */
        #input-section {
            background-color: #111;
            padding: 10px;
            border-top: 2px solid #00ff00;
            display: flex;
            align-items: center;
        }

        #input-line {
            display: flex;
            align-items: center;
            width: 100%;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            padding: 0 5px;
            outline: none;
            background: none;
            border: none;
            caret-color: #00ff00;
        }

        .blinking {
            animation: blink 0.8s step-start infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Viewer count display */
        #viewer-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 255, 0, 0.7);
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            color: black;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                font-size: 0.9rem;
            }

            #terminal {
                padding: 10px;
            }

            #viewer-count {
                font-size: 12px;
                bottom: 10px;
                right: 10px;
            }
        }

        @media (max-width: 480px) {
            #terminal {
                padding: 5px;
            }

            #viewer-count {
                font-size: 10px;
                bottom: 5px;
                right: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">
            <span>Welcome to the HDO Pro Download Terminal</span>
        </div>
        <div class="line">
            <span>Make sure to enter the exact commands..</span>
        </div>
        <div class="line">
            <span>Enter the startup code to proceed. Hint: 404</span>
        </div>
        <div class="line">
            <span>
                Download Links:
                <a href="/downloads/android" class="download-link">Android</a> |
                <a href="/downloads/ios" class="download-link">iOS</a> |
                <a href="/downloads/windows" class="download-link">Windows</a> |
                <a href="/downloads/mac" class="download-link">Mac</a>
            </span>
        </div>
    </div>
    <div id="input-section">
        <span>&gt; </span>
        <div id="input-line" contenteditable="true" role="textbox" aria-placeholder="Type here..."></div>
        <span class="blinking">|</span>
    </div>

    <div id="viewer-count">Viewers: 0</div>

    <script>
        const terminal = document.getElementById("terminal");
        const inputLine = document.getElementById("input-line");
        const viewerCountDisplay = document.getElementById("viewer-count");
        let inputBuffer = "";
        let viewerCount = 0;

        // Focus input area on page load
        inputLine.focus();

        // Ensure input stays in focus
        document.addEventListener("click", () => inputLine.focus());

        // Handle user input
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const input = inputLine.textContent.trim();
                inputLine.textContent = "";
                processInput(input);
            }
        });

        function processInput(input) {
            if (input.toLowerCase() === "404") {
                addLine("Correct startup code! Welcome.");
                incrementViewerCount();
            } else if (input) {
                addLine(`Unknown command: ${input}`);
            }
        }

        function addLine(text) {
            const line = document.createElement("div");
            line.classList.add("line");
            line.innerHTML = `<span>${text}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight; // Scroll to bottom
        }

        function incrementViewerCount() {
            viewerCount++;
            viewerCountDisplay.textContent = `Viewers: ${viewerCount}`;
        }
    </script>
</body>
</html>
