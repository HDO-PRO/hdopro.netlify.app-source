<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal For HDO Pro">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00; /* Linux-like green text */
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem; /* Default font size for readability */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px;
            flex-grow: 1;
            box-sizing: border-box;
            overflow-y: auto;
            min-height: 0; /* Ensures it fills the available space */
        }

        .line span {
            color: #00ff00; /* Ensure all text is green */
        }

        /* Blinking Cursor Animation */
        .blinking {
            animation: blink 0.8s step-start infinite;
            color: #00ff00; /* Green blinking cursor */
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Link Style */
        a {
            color: #00ff00; /* Green links */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #input-line {
            display: flex;
            align-items: center;
            width: 100%;
        }

        #user-input {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            padding: 0;
            margin: 0;
        }

        #input-line:focus-within {
            outline: none;
        }

        /* Viewer count display */
        #viewer-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 255, 0, 0.7);
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            color: black;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                font-size: 0.9rem; /* Slightly smaller text for mobile */
            }

            #terminal {
                padding: 10px;
            }

            #viewer-count {
                font-size: 12px; /* Smaller viewer count on mobile */
                bottom: 10px;
                right: 10px;
            }

            #input-line span {
                font-size: 1.2rem; /* Larger input text for easier mobile typing */
            }
        }

        @media (max-width: 480px) {
            #terminal {
                padding: 5px;
            }

            #viewer-count {
                font-size: 10px;
                bottom: 5px;
                right: 5px;
            }

            #input-line span {
                font-size: 1.5rem; /* Even larger input text for small screens */
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">
            <span>Welcome to the HDO Pro Download Terminal</span>
        </div>
        <div class="line">
            <span>Make sure to enter the exact commands..</span>
        </div>
        <div class="line">
            <span>Enter the startup code to proceed. Hint: 404</span>
        </div>
        <div id="input-line" contenteditable="true" role="textbox" aria-placeholder="Type here...">
            <span>&gt; </span><span id="user-input"></span><span class="blinking">|</span>
        </div>
    </div>

    <!-- Viewer count -->
    <div id="viewer-count">Viewers: 0</div>

    <script>
        const terminal = document.getElementById("terminal");
        const userInputDisplay = document.getElementById("user-input");
        const viewerCountDisplay = document.getElementById("viewer-count");
        let inputBuffer = ""; // To store typed commands
        let hasAccess = false; // Determines if the user has entered the correct code
        let awaitingResponse = null; // To track if we are waiting for a response
        let viewerCount = 0; // Counter for viewers who entered the code correctly

        // Disable right-click
        document.addEventListener("contextmenu", (e) => e.preventDefault());

        // Disable key combinations like F12, Ctrl+Shift+I, etc.
        document.addEventListener("keydown", (e) => {
            const blockedKeys = ["F12", "I", "C", "J", "U"];
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.shiftKey && blockedKeys.includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key.toLowerCase() === "u")
            ) {
                e.preventDefault();
            }
        });

        // Disable text selection and copying
        document.addEventListener("copy", (e) => e.preventDefault());
        document.addEventListener("cut", (e) => e.preventDefault());
        document.addEventListener("selectstart", (e) => e.preventDefault());

        // Listen for key presses
        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (!hasAccess) {
                    verifyStartupCode(inputBuffer.trim());
                } else {
                    addLine(`> ${inputBuffer}`);
                    processCommand(inputBuffer.trim());
                }
                inputBuffer = ""; // Clear the input buffer
                userInputDisplay.textContent = ""; // Clear the displayed input
            } else if (e.key === "Backspace") {
                inputBuffer = inputBuffer.slice(0, -1); // Remove the last character
                userInputDisplay.textContent = inputBuffer; // Update displayed input
            } else if (e.key.length === 1) {
                inputBuffer += e.key; // Add character to the buffer
                userInputDisplay.textContent = inputBuffer; // Update displayed input
            }
        });

        function verifyStartupCode(code) {
            if (code.toLowerCase() === "neko") {
                addLine("Access granted. You may now enter commands.");
                listCommands();
                hasAccess = true;
                incrementViewerCount(); // Increment viewer count after successful code entry
            } else {
                addLine("Invalid code. Hint: 404");
            }
        }

        function listCommands() {
            addLine("Available commands:");
            addLine("- /apk: Get APK links (Stable or Beta).");
            addLine("- /apk-tv: Get the TV APK link.");
            addLine("- /player: Get player links (Stable or Beta).");
            addLine("- /stable: Select Stable version (if prompted).");
            addLine("- /beta: Select Beta version (if prompted).");
        }

        function processCommand(command) {
            if (awaitingResponse === "apk-version") {
                if (command === "/stable") {
                    addLine(`Stable APK link: <a href="https://hdopro.netlify.app/apk" target="_blank">Download Stable APK</a>`);
                } else if (command === "/beta") {
                    addLine(`Beta APK link: <a href="https://hdopro.netlify.app/apk-b" target="_blank">Download Beta APK</a>`);
                } else {
                    addLine(`Unknown option: ${command}`);
                }
                awaitingResponse = null; // Reset awaiting response
                return;
            }

            switch (command.toLowerCase()) {
                case "/apk":
                    awaitingResponse = "apk-version";
                    addLine("Which version would you like? Type /stable or /beta.");
                    break;
                case "/apk-tv":
                    addLine(`TV APK link: <a href="https://hdopro.netlify.app/apk-tv" target="_blank">Download TV APK</a>`);
                    break;
                case "/player":
                    awaitingResponse = "player-version";
                    addLine("Which player version would you like? Type /stable or /beta.");
                    break;
                case "/stable":
                    addLine(`Stable version selected.`);
                    break;
                case "/beta":
                    addLine(`Beta version selected.`);
                    break;
                default:
                    addLine(`Command not recognized: ${command}`);
                    break;
            }
        }

        function addLine(text) {
            const line = document.createElement("div");
            line.classList.add("line");
            line.innerHTML = `<span>${text}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight; // Auto-scroll to the bottom
        }

        function incrementViewerCount() {
            viewerCount++;
            viewerCountDisplay.textContent = `Viewers: ${viewerCount}`;
        }
    </script>
</body>
</html>
