<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal for accessing HDO Pro. Intended for PC and mobile usage.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none; /* Disable text selection */
        }
        #terminal {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .line {
            margin: 5px 0;
            word-wrap: break-word; /* Ensure text wraps on small screens */
        }
        #input-line {
            display: flex;
            align-items: center;
        }
        #input-line span {
            white-space: pre;
        }
        #user-input {
            flex: 1;
            outline: none;
            border: none;
            background: transparent;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            caret-color: #00ff00; /* Green caret for better visibility */
        }
        .blinking {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        #viewer-count {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #222;
            color: #00ff00;
            text-align: center;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            display: none; /* Hidden by default */
        }
        @media (max-width: 768px) {
            #terminal {
                font-size: 14px;
            }
            #viewer-count {
                font-size: 10px;
                padding: 5px;
            }
        }
        @media (max-width: 480px) {
            #terminal {
                font-size: 12px;
                padding: 5px;
            }
            #viewer-count {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">Welcome to the HDO Pro Download Terminal</div>
        <div class="line">This terminal is to access HDO Pro and works on PC and mobile.</div>
        <div class="line">Make sure to enter the exact commands..</div>
        <div id="input-line">
            <span>&gt; </span>
            <input id="user-input" type="text" autofocus placeholder="Type here...">
        </div>
    </div>
    <div id="viewer-count">Viewers: 0</div>
    <script>
        const userInput = document.getElementById("user-input");
        const terminal = document.getElementById("terminal");

        // Focus input field on load
        window.addEventListener("load", () => {
            userInput.focus();
        });

        // Add command execution on Enter
        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const inputText = userInput.value.trim();
                if (inputText) {
                    const newLine = document.createElement("div");
                    newLine.className = "line";
                    newLine.textContent = `> ${inputText}`;
                    terminal.insertBefore(newLine, userInput.parentElement);
                    userInput.value = ""; // Clear the input
                    terminal.scrollTop = terminal.scrollHeight; // Auto-scroll
                }
            }
        });

        // Ensure input field regains focus if user clicks outside
        terminal.addEventListener("click", () => {
            userInput.focus();
        });
    </script>
</body>
</html>
