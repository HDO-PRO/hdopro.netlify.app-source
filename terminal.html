<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal For HDO Pro">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px;
            flex-grow: 1;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .line span {
            color: #00ff00;
        }

        /* Input section always at the bottom */
        #terminal-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        #input-section {
            margin-top: auto;
        }

        /* Blinking Cursor Animation */
        .blinking {
            animation: blink 0.8s step-start infinite;
            color: #00ff00;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Link Style */
        a {
            color: #00ff00;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #input-line {
            display: flex;
            align-items: center;
            width: 100%;
        }

        #user-input {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            padding: 0;
            margin: 0;
        }

        /* Viewer count display */
        #viewer-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 255, 0, 0.7);
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            color: black;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                font-size: 0.9rem;
            }

            #terminal {
                padding: 10px;
            }

            #viewer-count {
                font-size: 12px;
                bottom: 10px;
                right: 10px;
            }
        }

        @media (max-width: 480px) {
            #terminal {
                padding: 5px;
            }

            #viewer-count {
                font-size: 10px;
                bottom: 5px;
                right: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="terminal-container">
        <div id="terminal">
            <div class="line">
                <span>Welcome to the HDO Pro Download Terminal</span>
            </div>
            <div class="line">
                <span>Make sure to enter the exact commands..</span>
            </div>
            <div class="line">
                <span>Enter the startup code to proceed. Hint: 404</span>
            </div>
        </div>
        <div id="input-section">
            <div id="input-line" contenteditable="true" role="textbox" aria-placeholder="Type here...">
                <span>&gt; </span><span id="user-input"></span><span class="blinking">|</span>
            </div>
        </div>
    </div>

    <div id="viewer-count">Viewers: 0</div>

    <script>
        const terminal = document.getElementById("terminal");
        const userInputDisplay = document.getElementById("user-input");
        const viewerCountDisplay = document.getElementById("viewer-count");
        let inputBuffer = "";
        let hasAccess = false;
        let awaitingResponse = null;
        let viewerCount = 0;

        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
            const blockedKeys = ["F12", "I", "C", "J", "U"];
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.shiftKey && blockedKeys.includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key.toLowerCase() === "u")
            ) {
                e.preventDefault();
            }
        });

        document.addEventListener("copy", (e) => e.preventDefault());
        document.addEventListener("cut", (e) => e.preventDefault());
        document.addEventListener("selectstart", (e) => e.preventDefault());

        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (!hasAccess) {
                    verifyStartupCode(inputBuffer.trim());
                } else {
                    addLine(`> ${inputBuffer}`);
                    processCommand(inputBuffer.trim());
                }
                inputBuffer = "";
                userInputDisplay.textContent = "";
            } else if (e.key === "Backspace") {
                inputBuffer = inputBuffer.slice(0, -1);
                userInputDisplay.textContent = inputBuffer;
            } else if (e.key.length === 1) {
                inputBuffer += e.key;
                userInputDisplay.textContent = inputBuffer;
            }
        });

        function verifyStartupCode(code) {
            if (code.toLowerCase() === "neko") {
                addLine("Access granted. You may now enter commands.");
                listCommands();
                hasAccess = true;
                incrementViewerCount();
            } else {
                addLine("Invalid code. Hint: 404");
            }
        }

        function listCommands() {
            addLine("Available commands:");
            addLine("- /apk: Get APK links (Stable or Beta).");
            addLine("- /apk-tv: Get the TV APK link.");
            addLine("- /player: Get player links (Stable or Beta).");
        }

        function processCommand(command) {
            switch (command.toLowerCase()) {
                case "/apk":
                    addLine("APK link: https://example.com/apk");
                    break;
                default:
                    addLine(`Unknown command: ${command}`);
            }
        }

        function addLine(text) {
            const line = document.createElement("div");
            line.classList.add("line");
            line.innerHTML = `<span>${text}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function incrementViewerCount() {
            viewerCount++;
            viewerCountDisplay.textContent = `Viewers: ${viewerCount}`;
        }
    </script>
</body>
</html>
