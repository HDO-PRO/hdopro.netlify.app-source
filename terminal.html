<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal For HDO Pro">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00; /* Linux-like green text */
            font-family: "Courier New", Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            max-height: calc(100vh - 50px); /* Keep space for input at bottom */
        }

        .line span {
            color: #00ff00; /* Ensure all text is green */
        }

        #input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #111; /* Slightly darker background for input */
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.5);
        }

        #user-input {
            display: inline-block;
            flex-grow: 1;
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            padding: 5px;
            outline: none;
        }

        /* Blinking Cursor Animation */
        .blinking {
            animation: blink 0.8s step-start infinite;
            color: #00ff00; /* Green blinking cursor */
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Link Style */
        a {
            color: #ff007f; /* Reddish-pink links */
            text-decoration: none;
        }

        a:hover {
            color: #ff4da6; /* Slightly lighter reddish-pink on hover */
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                font-size: 0.9rem; /* Slightly smaller text for mobile */
            }

            #terminal {
                padding: 10px;
            }

            #input-container {
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            #terminal {
                padding: 5px;
            }

            #input-container {
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">
            <span>Welcome to the HDO Pro Download Terminal</span>
        </div>
        <div class="line">
            <span>Make sure to enter the exact commands..</span>
        </div>
        <div class="line">
            <span>Enter the startup code to proceed. Hint: 404</span>
        </div>
    </div>

    <!-- Input area -->
    <div id="input-container">
        <span>&gt; </span>
        <input type="text" id="user-input" placeholder="Type here..." autocomplete="off">
        <span class="blinking">|</span>
    </div>

    <script>
        const terminal = document.getElementById("terminal");
        const userInput = document.getElementById("user-input");
        let inputBuffer = ""; // To store typed commands
        let hasAccess = false; // Determines if the user has entered the correct code

        // Disable right-click and certain shortcuts
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                processInput();
            }
        });

        function processInput() {
            const command = userInput.value.trim();
            if (command === "") return;

            if (!hasAccess) {
                verifyStartupCode(command);
            } else {
                addLine(`> ${command}`);
                processCommand(command);
            }

            userInput.value = ""; // Clear the input field
        }

        function verifyStartupCode(code) {
            if (code.toLowerCase() === "404") {
                addLine("Access granted. You may now enter commands.");
                listCommands();
                hasAccess = true;
            } else {
                addLine("Invalid code. Hint: 404");
            }
        }

        function listCommands() {
            addLine("Available commands:");
            addLine("- /apk: Get APK links (Stable or Beta).");
            addLine("- /apk-tv: Get the TV APK link.");
            addLine("- /player: Get player links (Stable or Beta).");
        }

        function processCommand(command) {
            switch (command.toLowerCase()) {
                case "/apk":
                    addLine("APK links:");
                    addLine(`- Stable: <a href="https://hdopro.netlify.app/apk" target="_blank">Download Stable APK</a>`);
                    addLine(`- Beta: <a href="https://hdopro.netlify.app/apk-b" target="_blank">Download Beta APK</a>`);
                    break;
                case "/apk-tv":
                    addLine(`TV APK link: <a href="https://hdopro.netlify.app/tv-apk" target="_blank">Download TV APK</a>`);
                    break;
                case "/player":
                    addLine("Player links:");
                    addLine(`- Stable: <a href="https://hdopro.netlify.app/player" target="_blank">Download Stable Player</a>`);
                    addLine(`- Beta: <a href="https://hdopro.netlify.app/player-b" target="_blank">Download Beta Player</a>`);
                    break;
                default:
                    addLine(`Unknown command: ${command}`);
                    break;
            }
        }

        function addLine(content) {
            const line = document.createElement("div");
            line.className = "line";
            line.innerHTML = `<span>${content}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight; // Scroll to the bottom
        }
    </script>
</body>
</html>
