<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal for accessing HDO Pro. Intended for PC and mobile usage.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        #terminal {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .line {
            margin: 5px 0;
            word-wrap: break-word;
        }

        #input-line {
            display: flex;
            align-items: center;
        }

            #input-line span {
                white-space: pre;
            }

        #user-input {
            flex: 1;
            outline: none;
            border: none;
            background: transparent;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            caret-color: #00ff00;
        }

        .blinking {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            #terminal {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            #terminal {
                font-size: 12px;
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">Welcome to the HDO Pro Download Terminal</div>
        <div class="line">This terminal is locked. Please enter the password.</div>
        <div class="line">(Hint: 404 what's the other part?)</div>
        <div id="input-line">
            <span>&gt; </span>
            <input id="user-input" type="text" autofocus placeholder="Type password...">
        </div>
    </div>
    <script>
        const userInput = document.getElementById("user-input");
        const terminal = document.getElementById("terminal");
        let isAuthenticated = false;

        const commands = {
            help: "Available commands: /help, /clear, /download [platform], /apk [version], /tv-apk, /apps, /roku, /downloads",
            clear: "clear",
            "/download android": "Redirecting to Android download...",
            "/download ios": "iOS downloads are no longer available.",
            "/download roku": "Redirecting to Roku download page...",
            "/apk latest": "Redirecting to the latest APK download...",
            "/apk beta": "Redirecting to the beta APK download...",
            "/apk stable": "Redirecting to the stable APK download...",
            "/tv-apk": "Redirecting to TV APK download...",
            "/apps": "Displaying list of apps...",
            "/downloads": "Available downloads: /download android, /download roku, /apk latest, /apk beta, /apk stable, /tv-apk, /apps"
        };

        const password = "neko";

        // Execute commands
        function executeCommand(input) {
            if (!isAuthenticated) {
                if (input === password) {
                    isAuthenticated = true;
                    addLine("Password accepted. You may now use the terminal.");
                    addLine(commands.help); // Display help automatically after password entry
                    userInput.placeholder = "Type command...";
                } else {
                    addLine("Incorrect password. Try again.");
                }
                return;
            }

            // Ensure the command starts with a slash
            if (!input.startsWith("/")) {
                alert("Please prefix your command with a slash (/).");
                return;
            }

            const inputLower = input.toLowerCase();
            if (commands[inputLower]) {
                if (inputLower.startsWith("/download ")) {
                    handleDownload(inputLower.split(" ")[1]);
                } else if (inputLower.startsWith("/apk ")) {
                    handleAPK(inputLower.split(" ")[1]);
                } else if (inputLower === "/clear") {
                    terminal.innerHTML = "";
                    createInputLine();
                } else if (inputLower === "/apps") {
                    displayApps();
                } else {
                    addLine(commands[inputLower]);
                }
            } else {
                addLine(`Unknown command: "${input}"`);
            }
        }

        // Display list of apps
        function displayApps() {
            const appsList = [
                { name: "Crunchyroll", website: "https://www.crunchyroll.com", github: "https://github.com/Crunchyroll" },
                { name: "Funimation", website: "https://www.funimation.com", github: "https://github.com/funimation" },
                { name: "Jellyfin", website: "https://jellyfin.org", github: "https://github.com/jellyfin/jellyfin" },
                { name: "Kitsu", website: "https://kitsu.io", github: "https://github.com/Kitsu" },
                { name: "Shinobi", website: "https://github.com/Shinobi-App", github: "https://github.com/Shinobi-App" },
                { name: "Tubi TV", website: "https://www.tubi.tv", github: "https://github.com/tubi" },
                { name: "AnimeTV", website: "https://github.com/AnimeTV/AnimeTV", github: "https://github.com/AnimeTV/AnimeTV" },
                { name: "Neko", website: "https://github.com/MarshMeadow/Neko", github: "https://github.com/MarshMeadow/Neko" },
                { name: "Stremio", website: "https://www.stremio.com", github: "https://github.com/Stremio" },
                { name: "Anime-Loader", website: "https://github.com/Anime-Loader/Anime-Loader", github: "https://github.com/Anime-Loader/Anime-Loader" },
                { name: "Sakura", website: "https://github.com/Sakura-Stream/Sakura", github: "https://github.com/Sakura-Stream/Sakura" }
            ];

            addLine("Anime Apps List:");
            appsList.forEach(app => {
                addLine(`${app.name}:`);
                addLine(`Official Website: <a href="${app.website}" target="_blank">${app.website}</a>`);
                addLine(`GitHub: <a href="${app.github}" target="_blank">${app.github}</a>`);
            });
        }

        // Handle download commands
        function handleDownload(platform) {
            switch (platform) {
                case "android":
                    addLine("Redirecting to Android download...");
                    window.location.href = "https://mega.nz/folder/5Ot0RQZa#6WiqCV6DI8yssRZiCrQVgg/file/MaVF2JpS";
                    break;
                case "roku":
                    addLine("Redirecting to Roku download page...");
                    window.location.href = "https://hdopro.netlify.app/roku-download";
                    break;
                case "ios":
                    addLine("iOS downloads are no longer available.");
                    break;
                default:
                    addLine(`Unknown platform: "${platform}"`);
            }
        }

        // Handle APK commands
        function handleAPK(version) {
            switch (version) {
                case "latest":
                    addLine("Redirecting to the latest APK download...");
                    window.location.href = "https://mega.nz/folder/5Ot0RQZa#6WiqCV6DI8yssRZiCrQVgg/file/MaVF2JpS";
                    break;
                case "beta":
                    addLine("Redirecting to the beta APK download...");
                    window.location.href = "https://mega.nz/folder/5Ot0RQZa#6WiqCV6DI8yssRZiCrQVgg/file/FDsWHATS";
                    break;
                case "stable":
                    addLine("Redirecting to the stable APK download...");
                    window.location.href = "https://mega.nz/folder/5Ot0RQZa#6WiqCV6DI8yssRZiCrQVgg/file/MaVF2JpS";
                    break;
                default:
                    addLine(`Unknown APK version: "${version}"`);
            }
        }

        // Add a new line to the terminal
        function addLine(text) {
            const newLine = document.createElement("div");
            newLine.className = "line";
            newLine.innerHTML = text;
            terminal.appendChild(newLine);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Create input line
        function createInputLine() {
            const inputLine = document.createElement("div");
            inputLine.id = "input-line";
            inputLine.innerHTML = '<span>&gt; </span><input id="user-input" type="text" autofocus>';
            terminal.appendChild(inputLine);
            userInput.focus();
            userInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    executeCommand(userInput.value.trim());
                    userInput.value = "";
                }
            });
        }

        createInputLine(); // Create the initial input line

        // Prevent right-click, inspect, and dev tools
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "U")) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
