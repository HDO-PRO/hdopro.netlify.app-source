<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal For HDO Pro">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 100%;
            height: 90vh;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .line {
            margin: 5px 0;
        }
        #input-line {
            display: flex;
            outline: none;
        }
        #input-line span {
            white-space: pre;
        }
        .blinking {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        #viewer-count {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #222;
            color: #00ff00;
            text-align: center;
            padding: 5px 0;
        }
        a {
            color: #00ffff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line"><span>Welcome to the HDO Pro Download Terminal</span></div>
        <div class="line"><span>Make sure to enter the exact commands..</span></div>
        <div class="line"><span>Enter the startup code to proceed. Hint: 404</span></div>
        <div id="input-line" contenteditable="true" role="textbox" aria-placeholder="Type here...">
            <span>&gt; </span><span id="user-input"></span><span class="blinking">|</span>
        </div>
    </div>
    <div id="viewer-count">Viewers: 0</div>

    <script>
        const terminal = document.getElementById("terminal");
        const userInputDisplay = document.getElementById("user-input");
        const viewerCountDisplay = document.getElementById("viewer-count");
        let inputBuffer = "";
        let hasAccess = false;
        let awaitingResponse = null;
        let viewerCount = 0;

        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
            const blockedKeys = ["F12", "I", "C", "J", "U"];
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && blockedKeys.includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === "u")) {
                e.preventDefault();
            }
        });

        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (!hasAccess) {
                    verifyStartupCode(inputBuffer.trim());
                } else {
                    addLine(`> ${inputBuffer}`);
                    processCommand(inputBuffer.trim());
                }
                inputBuffer = "";
                userInputDisplay.textContent = "";
            } else if (e.key === "Backspace") {
                inputBuffer = inputBuffer.slice(0, -1);
                userInputDisplay.textContent = inputBuffer;
            } else if (e.key.length === 1) {
                inputBuffer += e.key;
                userInputDisplay.textContent = inputBuffer;
            }
        });

        function verifyStartupCode(code) {
            if (code.toLowerCase() === "neko") {
                addLine("Access granted. You may now enter commands.");
                listCommands();
                hasAccess = true;
                incrementViewerCount();
            } else {
                addLine("Invalid code. Hint: 404");
            }
        }

        function listCommands() {
            addLine("Available commands:");
            addLine("- /apk: Get APK links (Stable or Beta).");
            addLine("- /apk-tv: Get the TV APK link.");
            addLine("- /player: Get player links (Stable or Beta).");
            addLine("- /stable: Select Stable version (if prompted).");
            addLine("- /beta: Select Beta version (if prompted).");
        }

        function processCommand(command) {
            if (awaitingResponse === "apk-version") {
                if (command === "/stable") {
                    addLine(`Stable APK link: <a href="https://hdopro.netlify.app/apk" target="_blank">Download Stable APK</a>`);
                } else if (command === "/beta") {
                    addLine(`Beta APK link: <a href="https://hdopro.netlify.app/apk-b" target="_blank">Download Beta APK</a>`);
                } else {
                    addLine(`Unknown option: ${command}`);
                }
                awaitingResponse = null;
                return;
            }

            switch (command.toLowerCase()) {
                case "/apk":
                    awaitingResponse = "apk-version";
                    addLine("Which version would you like? Type /stable or /beta.");
                    break;
                case "/apk-tv":
                    addLine(`TV APK link: <a href="https://hdopro.netlify.app/apk-tv" target="_blank">Download TV APK</a>`);
                    break;
                case "/player":
                    awaitingResponse = "player-version";
                    addLine("Which player version would you like? Type /stable or /beta.");
                    break;
                default:
                    addLine(`Command not recognized: ${command}`);
            }
        }

        function addLine(text) {
            const line = document.createElement("div");
            line.className = "line";
            line.innerHTML = text;
            terminal.insertBefore(line, document.getElementById("input-line"));
            terminal.scrollTop = terminal.scrollHeight;
        }

        function incrementViewerCount() {
            viewerCount++;
            viewerCountDisplay.textContent = `Viewers: ${viewerCount}`;
        }
    </script>
</body>
</html>
