<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal For HDO Pro">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0ff;
            font-family: "Courier New", Courier, monospace;
            user-select: none;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .line {
            margin-bottom: 5px;
        }

        a {
            color: #0ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #input-line {
            display: flex;
        }

        #user-input {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
        }

        .blinking {
            animation: blink 0.8s step-start infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">
            <span>Welcome to the HDO Pro Download Terminal</span>
        </div>
        <div class="line">
            <span>Make sure to enter the exact commands..</span>
        </div>
        <div class="line">
            <span>Enter the startup code to proceed. Hint: 404</span>
        </div>
        <div id="input-line">
            <span>&gt; </span><span id="user-input"></span><span class="blinking">|</span>
        </div>
    </div>

    <script>
        const terminal = document.getElementById("terminal");
        const userInputDisplay = document.getElementById("user-input");
        let inputBuffer = "";
        let hasAccess = false;
        let awaitingResponse = null;

        document.addEventListener("contextmenu", (e) => e.preventDefault());

        document.addEventListener("keydown", (e) => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && ["I", "C", "J", "U"].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        });

        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (!hasAccess) {
                    verifyStartupCode(inputBuffer.trim());
                } else {
                    addLine(`> ${inputBuffer}`);
                    processCommand(inputBuffer.trim());
                }
                inputBuffer = "";
                userInputDisplay.textContent = "";
            } else if (e.key === "Backspace") {
                inputBuffer = inputBuffer.slice(0, -1);
                userInputDisplay.textContent = inputBuffer;
            } else if (e.key.length === 1) {
                inputBuffer += e.key;
                userInputDisplay.textContent = inputBuffer;
            }
        });

        function verifyStartupCode(code) {
            if (code.toLowerCase() === "neko") {
                addLine("Access granted. You may now enter commands.");
                listCommands();
                hasAccess = true;
            } else {
                addLine("Invalid code. Hint: 404");
            }
        }

        function listCommands() {
            addLine("Available commands:");
            addLine("- /apk: Get APK links (Stable or Beta).");
            addLine("- /apk-tv: Get the TV APK link.");
            addLine("- /player: Get player links (Stable or Beta).");
            addLine("- /stable: Select Stable version (if prompted).");
            addLine("- /beta: Select Beta version (if prompted).");
        }

        function processCommand(command) {
            if (awaitingResponse === "apk-version") {
                if (command === "/stable") {
                    addLine(`Stable APK link: <a href="https://hdopro.netlify.app/apk" target="_blank">Download Stable APK</a>`);
                } else if (command === "/beta") {
                    addLine(`Beta APK link: <a href="https://hdopro.netlify.app/apk-b" target="_blank">Download Beta APK</a>`);
                } else {
                    addLine(`Unknown option: ${command}`);
                }
                awaitingResponse = null;
                return;
            }

            switch (command.toLowerCase()) {
                case "/apk":
                    addLine("Do you want the stable or beta APK? Type /stable or /beta.");
                    awaitingResponse = "apk-version";
                    break;
                case "/apk-tv":
                    addLine(`TV APK link: <a href="https://hdopro.netlify.app/apk-tv" target="_blank">Download HDO Pro TV APK</a>`);
                    break;
                case "/player":
                    addLine("Which player do you want? Type /stable or /beta.");
                    awaitingResponse = "player-version";
                    break;
                case "/stable":
                    if (awaitingResponse === "player-version") {
                        addLine(`Stable Player link: <a href="https://hdopro.netlify.app/player-apk" target="_blank">Download Stable Player</a>`);
                        awaitingResponse = null;
                    } else {
                        addLine(`Unknown command: ${command}`);
                    }
                    break;
                case "/beta":
                    if (awaitingResponse === "player-version") {
                        addLine(`Beta Player link: <a href="https://hdopro.netlify.app/player-apk" target="_blank">Download Beta Player</a>`);
                        awaitingResponse = null;
                    } else {
                        addLine(`Unknown command: ${command}`);
                    }
                    break;
                default:
                    addLine(`Unknown command: ${command}`);
                    break;
            }
        }

        function addLine(text) {
            const line = document.createElement("div");
            line.className = "line";
            line.innerHTML = `<span>${text}</span>`;
            terminal.insertBefore(line, document.getElementById("input-line"));
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
