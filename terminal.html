<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Interface</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 0;
        }
        #terminal {
            width: 100%;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .line {
            display: flex;
            align-items: center;
        }
        .line span.blinking {
            animation: blink 0.8s step-start infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        .typed-text {
            display: inline;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid lime;
            animation: typing 2s steps(20, end), blink-caret 0.8s step-start infinite;
        }
        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }
        @keyframes blink-caret {
            50% {
                border-color: transparent;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="welcome" class="line">
            <span>Welcome to the HDO Pro Download Terminal</span>
        </div>
        <div id="prompt1" class="line">
            <span>Type </span><span class="typed-text">start</span><span> to begin.</span>
        </div>
    </div>

    <script>
        const terminal = document.getElementById("terminal");

        let started = false;
        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (!started) {
                    startProcess();
                    started = true;
                }
            }
        });

        function startProcess() {
            addLine("Initializing download...", true);
            setTimeout(() => addLine("Fetching the HDO Pro app..."), 1000);
            setTimeout(() => addLine("Download ready: [Click here to download HDO Pro](#)"), 2000);
            setTimeout(() => addLine("Process complete. Thank you for using our terminal!"), 3000);
        }

        function addLine(text, blinking = false) {
            const line = document.createElement("div");
            line.className = "line";
            line.innerHTML = blinking ? `<span>${text}</span><span class="blinking">_</span>` : `<span>${text}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
