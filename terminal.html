<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal for accessing HDO Pro. Intended for PC and mobile usage.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none; /* Prevent text selection */
            overflow: hidden; /* Prevent scrollbars */
        }

        #terminal {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .line {
            margin: 5px 0;
            word-wrap: break-word;
        }

        #input-line {
            display: flex;
            align-items: center;
        }

            #input-line span {
                white-space: pre;
            }

        #user-input {
            flex: 1;
            outline: none;
            border: none;
            background: transparent;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            caret-color: #00ff00;
        }

        .blinking {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            #terminal {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            #terminal {
                font-size: 12px;
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">Welcome to the HDO Pro Download Terminal</div>
        <div class="line">This terminal is locked. Please enter the password.</div>
        <div class="line">(Hint: 404 what's the other part?)</div>
        <div id="input-line">
            <span>&gt; </span>
            <input id="user-input" type="text" autofocus placeholder="Type password...">
        </div>
    </div>
    <script>
        const userInput = document.getElementById("user-input");
        const terminal = document.getElementById("terminal");
        let isAuthenticated = false;

        const commands = {
            help: "Available commands: /help, /clear, /download [platform], /apk [version], /tv-apk, /apps, /roku, /downloads",
            clear: "clear",
            "/apps": `List of Anime Apps:
1. **Crunchyroll** (Official)
       - Website: https://www.crunchyroll.com
2. **Funimation** (Official)
       - Website: https://www.funimation.com
3. **AnimeDLR** (Unofficial)
       - GitHub: https://github.com/CarlosEsco/AnimeDLR
4. **Aniyomi** (Unofficial)
       - GitHub: https://github.com/jmir1/aniyomi
5. **GogoAnime** (Unofficial)
       - Website: https://gogoanime.pe`
        };

        const password = "neko";

        function executeCommand(input) {
            if (!isAuthenticated) {
                if (input === password) {
                    isAuthenticated = true;
                    addLine("Password accepted. You may now use the terminal.");
                    addLine(commands.help);
                    userInput.placeholder = "Type command...";
                } else {
                    addLine("Incorrect password. Try again.");
                }
                return;
            }

            if (!input.startsWith("/")) {
                alert("Please prefix your command with a slash (/).");
                return;
            }

            const inputLower = input.toLowerCase();
            if (commands[inputLower]) {
                addLine(commands[inputLower]);
            } else {
                addLine(`Unknown command: "${input}"`);
            }
        }

        function addLine(text) {
            const newLine = document.createElement("div");
            newLine.className = "line";
            newLine.textContent = text;
            terminal.insertBefore(newLine, userInput.parentElement);
            terminal.scrollTop = terminal.scrollHeight;
        }

        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const inputText = userInput.value.trim();
                if (inputText) {
                    addLine(`> ${inputText}`);
                    executeCommand(inputText);
                    userInput.value = "";
                }
            }
        });

        window.addEventListener("load", () => {
            userInput.focus();
        });

        terminal.addEventListener("click", () => {
            userInput.focus();
        });
    </script>
</body>
</html>
