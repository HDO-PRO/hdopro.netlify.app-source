<script>
    const terminal = document.getElementById("terminal");
    const userInputDisplay = document.getElementById("user-input");
    const viewerCountDisplay = document.getElementById("viewer-count");
    const keyboardButton = document.getElementById("keyboard-button");
    let inputBuffer = "";
    let hasAccess = false;
    let awaitingResponse = null;
    let viewerCount = 0;
    let commandHistory = [];
    let currentHistoryIndex = -1;

    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
        const blockedKeys = ["F12", "I", "C", "J", "U"];
        if (e.key === "F12" || (e.ctrlKey && e.shiftKey && blockedKeys.includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === "u")) {
            e.preventDefault();
        }
    });

    window.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            if (!hasAccess) {
                verifyStartupCode(inputBuffer.trim());
            } else {
                addLine(`> ${inputBuffer}`);
                processCommand(inputBuffer.trim());
            }
            clearInput();
        } else if (e.key === "Backspace") {
            inputBuffer = inputBuffer.slice(0, -1);
            userInputDisplay.textContent = inputBuffer;
        } else if (e.key === "ArrowUp") {
            if (currentHistoryIndex > 0) {
                currentHistoryIndex--;
                inputBuffer = commandHistory[currentHistoryIndex];
                userInputDisplay.textContent = inputBuffer;
            }
        } else if (e.key === "ArrowDown") {
            if (currentHistoryIndex < commandHistory.length - 1) {
                currentHistoryIndex++;
                inputBuffer = commandHistory[currentHistoryIndex];
                userInputDisplay.textContent = inputBuffer;
            } else {
                currentHistoryIndex = commandHistory.length;
                inputBuffer = "";
                userInputDisplay.textContent = "";
            }
        } else if (e.key.length === 1) {
            inputBuffer += e.key;
            userInputDisplay.textContent = inputBuffer;
        }
    });

    function verifyStartupCode(code) {
        if (code.toLowerCase() === "neko") {
            addLine("✅ Access granted! Welcome to the terminal. 😊");
            listCommands();
            hasAccess = true;
            incrementViewerCount();
        } else {
            addLine("❌ Invalid code. Hint: 404 🤔");
        }
    }

    function listCommands() {
        addLine("📜 Available commands:");
        addLine("- /apk: Get APK links (Stable or Beta).");
        addLine("- /apk-tv: Get the TV APK link.");
        addLine("- /player: Get player links (Stable or Beta).");
        addLine("- /stable: Select Stable version (if prompted).");
        addLine("- /beta: Select Beta version (if prompted).");
        addLine("- /back: Go back to the previous step.");
        addLine("- /startover: Start over and reset everything.");
        addLine("- /apps: Explore other apps available. 🌟");
        addLine("- /???: Something secret... 👀");
    }

    function processCommand(command) {
        commandHistory.push(command);
        currentHistoryIndex = commandHistory.length;

        if (awaitingResponse === "apk-version") {
            if (command === "/stable") {
                addLine(`📦 Stable APK link: <a href="https://hdopro.netlify.app/apk" target="_blank">Download Stable APK</a>`);
            } else if (command === "/beta") {
                addLine(`📦 Beta APK link: <a href="https://hdopro.netlify.app/apk-b" target="_blank">Download Beta APK</a>`);
            } else {
                addLine(`🤷 Unknown option: ${command}`);
            }
            awaitingResponse = null;
            return;
        }

        switch (command.toLowerCase()) {
            case "/apk":
                awaitingResponse = "apk-version";
                addLine("💾 Which version would you like? Type /stable or /beta.");
                break;
            case "/apk-tv":
                addLine(`📺 TV APK link: <a href="https://hdopro.netlify.app/apk-tv" target="_blank">Download TV APK</a>`);
                break;
            case "/player":
                awaitingResponse = "player-version";
                addLine("🎮 Which player version would you like? Type /stable or /beta.");
                break;
            case "/apps":
                listApps();
                break;
            case "/back":
                addLine("🔙 You can't go back yet. You haven't made a choice.");
                break;
            case "/startover":
                startOver();
                break;
            case "/???":
                (function () {
                    const message = document.createElement("div");
                    message.classList.add("line");
                    message.innerHTML = `<span>🎉 Congratulations, you're a true HDO Pro fan! 🎉</span>`;
                    terminal.appendChild(message);
                    terminal.scrollTop = terminal.scrollHeight;
                })();
                break;
            default:
                addLine(`❓ Command not recognized: ${command}`);
        }
    }

    function listApps() {
        addLine("🌟 Available Apps:");
        addLine(`- Nekomo: for anime <a href="https://github.com/Nekomo-App/Nekomo" target="_blank">View on GitHub</a> 🐾`);
        addLine(`- Dantotsu: also for anime <a href="https://github.com/rebelonion/Dantotsu" target="_blank">View on GitHub</a> 📚`);
        addLine(`- Cloudstream: for movies, TV shows, and anime <a href="https://github.com/recloudstream/cloudstream" target="_blank">View on GitHub</a> ☁️`);
    }

    function addLine(text) {
        const line = document.createElement("div");
        line.classList.add("line");
        line.innerHTML = `<span>${text}</span>`;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function clearInput() {
        inputBuffer = "";
        userInputDisplay.textContent = "";
    }

    function incrementViewerCount() {
        viewerCount++;
        viewerCountDisplay.textContent = `👀 Viewers: ${viewerCount}`;
        viewerCountDisplay.style.display = "block";
    }

    function startOver() {
        addLine("🔄 Starting over... Resetting everything.");
        hasAccess = false;
        awaitingResponse = null;
        viewerCount = 0;
        viewerCountDisplay.style.display = "none";
        commandHistory = [];
        currentHistoryIndex = -1;
        clearInput();
    }
</script>
