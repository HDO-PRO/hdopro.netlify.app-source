<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HDO Pro | Terminal</title>
    <meta property="og:url" content="/terminal" />
    <meta property="og:title" content="HDO Pro | Terminal">
    <meta property="og:description" content="Terminal For HDO Pro">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta name="theme-color" content="#8d2249" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00; /* Linux-like green text */
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem; /* Default font size for readability */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px;
            flex-grow: 1;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .line span {
            color: #00ff00;
        }

        .blinking {
            animation: blink 0.8s step-start infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        a {
            color: #00ff00;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #input-line {
            display: flex;
            align-items: center;
            width: 100%;
        }

        #user-input {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
        }

        #viewer-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 255, 0, 0.7);
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            color: black;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line">
            <span>Welcome to the HDO Pro Download Terminal</span>
        </div>
        <div class="line">
            <span>Make sure to enter the exact commands..</span>
        </div>
        <div class="line">
            <span>Enter the startup code to proceed. Hint: 404</span>
        </div>
        <div id="input-line">
            <span>&gt; </span><span id="user-input"></span><span class="blinking">|</span>
        </div>
    </div>
    <div id="viewer-count">Viewers: 0</div>

    <script>
        const terminal = document.getElementById("terminal");
        const userInputDisplay = document.getElementById("user-input");
        const viewerCountDisplay = document.getElementById("viewer-count");

        let inputBuffer = "";
        let hasAccess = false;
        let viewerCount = 0;

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const command = inputBuffer.trim();
                if (!hasAccess) {
                    verifyStartupCode(command);
                } else {
                    processCommand(command);
                }
                inputBuffer = "";
                userInputDisplay.textContent = "";
            } else if (e.key === "Backspace") {
                inputBuffer = inputBuffer.slice(0, -1);
                userInputDisplay.textContent = inputBuffer;
            } else if (e.key.length === 1) {
                inputBuffer += e.key;
                userInputDisplay.textContent = inputBuffer;
            }
        });

        function verifyStartupCode(code) {
            if (code.toLowerCase() === "neko") {
                addLine("Access granted. You may now enter commands.");
                listCommands();
                hasAccess = true;
                incrementViewerCount();
            } else {
                addLine("Invalid code. Hint: 404");
            }
        }

        function listCommands() {
            addLine("Available commands:");
            addLine("- /apk: Get APK links (Stable or Beta).");
            addLine("- /apk-tv: Get the TV APK link.");
            addLine("- /player: Get player links (Stable or Beta).");
        }

        function processCommand(command) {
            switch (command.toLowerCase()) {
                case "/apk":
                    addLine("Stable APK: <a href='https://hdopro.netlify.app/apk' target='_blank'>Download Stable</a>");
                    addLine("Beta APK: <a href='https://hdopro.netlify.app/apk-b' target='_blank'>Download Beta</a>");
                    break;
                case "/apk-tv":
                    addLine("TV APK: <a href='https://hdopro.netlify.app/tv-apk' target='_blank'>Download</a>");
                    break;
                case "/player":
                    addLine("Stable Player: <a href='https://hdopro.netlify.app/player' target='_blank'>Download Stable</a>");
                    addLine("Beta Player: <a href='https://hdopro.netlify.app/player-b' target='_blank'>Download Beta</a>");
                    break;
                default:
                    addLine(`Unknown command: ${command}`);
            }
        }

        function addLine(text) {
            const line = document.createElement("div");
            line.classList.add("line");
            line.innerHTML = `<span>${text}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function incrementViewerCount() {
            viewerCount++;
            viewerCountDisplay.textContent = `Viewers: ${viewerCount}`;
        }
    </script>
</body>
</html>
