<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Connection</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f4f6;
            overflow: hidden;
        }
        .verification-box {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cloudflare-logo {
            width: 50px;
            height: 50px;
            background: url('https://www.cloudflare.com/img/cf-logo.svg') no-repeat center center;
            background-size: contain;
            margin-bottom: 20px;
            animation: rotate 2s linear infinite;
        }
        .message {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
        }
        .verify-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .verify-button:hover {
            background-color: #45a049;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="verification-box" id="verificationBox">
        <div class="cloudflare-logo"></div>
        <div class="message">Please wait while we verify your connection...</div>
        <div class="spinner" id="spinner"></div>
        <button class="verify-button" id="verifyButton" style="display:none;">Verify Now</button>
    </div>

    <script>
        function verifyCloudflare() {
            // Simulating the Cloudflare verification process with a delay
            setTimeout(() => {
                // Check if verified (simulated with a random outcome)
                const isVerified = Math.random() > 0.2; // 80% chance of success
                if (isVerified) {
                    document.getElementById('verificationBox').innerHTML = `
                        <div class="cloudflare-logo" style="background-image: url('https://www.cloudflare.com/img/cf-logo.svg');"></div>
                        <div class="message">Your connection has been verified!</div>
                        <a href="/" class="verify-button">Continue to the site</a>
                    `;
                } else {
                    // Retry if verification failed
                    document.getElementById('spinner').style.animation = 'none'; // Stop spinner
                    document.getElementById('verifyButton').style.display = 'inline-block'; // Show retry button
                    document.getElementById('verifyButton').onclick = () => location.reload(); // Retry
                }
            }, 3000); // Simulating Cloudflare verification delay
        }

        // Start the verification process on page load
        window.onload = verifyCloudflare;
    </script>
</body>
</html>
