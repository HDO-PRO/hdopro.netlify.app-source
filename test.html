<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDO Pro - Test Page</title>
    <meta name="theme-color" content="#8d2249" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Images/test-background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 0;
            margin: 0;
            position: relative;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 100px auto 0;
            background-color: rgba(51, 51, 51, 0.8);
            padding: 15px;
            border-radius: 8px;
            position: relative;
            z-index: 1;
            padding-top: 60px;
            border: 2px solid rgba(153, 51, 153, 0.5);
            box-shadow: 0 0 5px rgba(153, 51, 153, 0.2);
        }
        h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            margin-bottom: 10px;
        }
        .alert {
            margin: 20px 0;
            background-color: rgba(255, 69, 0, 0.9);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        .info {
            margin: 20px 0;
            background-color: rgba(51, 153, 255, 0.9);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HDO Pro - Test Page</h1>
        <p class="info">This is a test page available only for contributors or donators.</p>
        <p class="alert">This page is temporary and may not always be accessible.</p>
    </div>

    <script>
        // Redirect to homepage after 30 seconds
        setTimeout(() => {
            window.location.href = "https://hdopro.netlify.app";
        }, 30000);
    </script>
</body>
</html>
