<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Content</title>
    <style>
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 2rem;
        }
        #content {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        Verifying connection...
    </div>

    <div id="content">
        <!-- Your website's content goes here -->
        <h1>Welcome to the secure page!</h1>
    </div>

    <script>
        function verifyCloudflare() {
            // Check for Cloudflare's header or JavaScript challenge cookies
            fetch(window.location.href, {
                method: 'HEAD',
                headers: {
                    'Cache-Control': 'no-cache',
                }
            })
            .then(response => {
                if (response.ok) {
                    // Cloudflare verified, show content
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    // If not verified, keep showing loading
                    setTimeout(verifyCloudflare, 1000);
                }
            })
            .catch(error => {
                console.error('Error verifying connection:', error);
                setTimeout(verifyCloudflare, 1000);
            });
        }

        // Start verification process
        verifyCloudflare();
    </script>
</body>
</html>
