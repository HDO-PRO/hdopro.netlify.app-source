    <style>
        .closed-backdrop {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.55);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }
        .closed-card {
            width: 100%;
            max-width: 540px;
            background: rgba(20,20,20,0.92);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            padding: 36px 28px;
            text-align: center;
        }
        .closed-card h1 { color: #ff66b2; margin: 0 0 18px; font-size: 1.6rem; }
        .closed-card p { color: #eee; line-height: 1.6; margin: 0 0 22px; font-size: 1rem; }
        .closed-card a { color: #ff66b2; text-decoration: none; }
        .closed-card a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .closed-card { padding: 28px 20px; }
            .closed-card h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="closed-backdrop">
        <div class="closed-card">
